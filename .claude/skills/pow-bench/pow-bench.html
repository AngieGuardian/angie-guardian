<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>PoW bench</title></head>
<body>
<pre id="out">running…</pre>
<script>
"use strict";
// Pure-JS SHA-256 (FIPS 180-4), ASCII input, returns Uint32Array(8).
const sha256 = (() => {
  const K = new Uint32Array([
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);
  const w = new Uint32Array(64);
  const buf = new Uint8Array(256);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  return (msg) => {
    const len = msg.length;
    const total = ((len + 9 + 63) >> 6) << 6;
    for (let i = 0; i < len; i++) buf[i] = msg.charCodeAt(i);
    buf.fill(0, len, total);
    buf[len] = 0x80;
    const bitLen = len * 8;
    buf[total - 2] = (bitLen >>> 8) & 0xff;
    buf[total - 1] = bitLen & 0xff;
    let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,
        h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;
    for (let off = 0; off < total; off += 64) {
      for (let i = 0; i < 16; i++) {
        const j = off + 4 * i;
        w[i] = (buf[j] << 24) | (buf[j+1] << 16) | (buf[j+2] << 8) | buf[j+3];
      }
      for (let i = 16; i < 64; i++) {
        const a = w[i-15], b = w[i-2];
        const s0 = rotr(a,7) ^ rotr(a,18) ^ (a >>> 3);
        const s1 = rotr(b,17) ^ rotr(b,19) ^ (b >>> 10);
        w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
      }
      let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,h=h7;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
        const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
      }
      h0=(h0+a)|0; h1=(h1+b)|0; h2=(h2+c)|0; h3=(h3+d)|0;
      h4=(h4+e)|0; h5=(h5+f)|0; h6=(h6+g)|0; h7=(h7+h)|0;
    }
    return new Uint32Array([h0,h1,h2,h3,h4,h5,h6,h7]);
  };
})();

const toHex = (words) =>
  Array.from(words, (x) => (x >>> 0).toString(16).padStart(8, "0")).join("");

async function main() {
  const result = { ok: true, errors: [] };
  const challenge = "a".repeat(64); // same shape as a real challenge (64 hex chars)

  // 1. Correctness: compare against crypto.subtle for assorted inputs.
  if (self.crypto && crypto.subtle) {
    for (const input of ["", "abc", challenge + "0", challenge + "123456789",
                         "x".repeat(55), "y".repeat(56), "z".repeat(64), "q".repeat(119)]) {
      const want = Array.from(new Uint8Array(
        await crypto.subtle.digest("SHA-256", new TextEncoder().encode(input))),
        (b) => b.toString(16).padStart(2, "0")).join("");
      const got = toHex(sha256(input));
      if (got !== want) {
        result.ok = false;
        result.errors.push(`len ${input.length}: got ${got} want ${want}`);
      }
    }
  } else {
    result.errors.push("crypto.subtle unavailable; correctness not verified");
  }

  // 2. Rate of the CURRENT solver loop: await crypto.subtle.digest per nonce.
  if (self.crypto && crypto.subtle) {
    const enc = new TextEncoder();
    let n = 0;
    const start = performance.now();
    while (performance.now() - start < 1500) {
      for (let i = 0; i < 200; i++) {
        await crypto.subtle.digest("SHA-256", enc.encode(challenge + n));
        n++;
      }
    }
    result.subtleRate = Math.round(n / ((performance.now() - start) / 1000));
  }

  // 3. Rate of the pure-JS loop.
  {
    let n = 0;
    let sink = 0;
    const start = performance.now();
    while (performance.now() - start < 1500) {
      for (let i = 0; i < 2000; i++) {
        sink ^= sha256(challenge + n)[0];
        n++;
      }
    }
    result.jsRate = Math.round(n / ((performance.now() - start) / 1000));
    result.sink = sink; // defeat dead-code elimination
  }

  result.hardwareConcurrency = navigator.hardwareConcurrency || null;
  result.userAgent = navigator.userAgent;
  document.getElementById("out").textContent = JSON.stringify(result, null, 2);
  window.__benchResult = result;
}
main();
</script>
</body>
</html>

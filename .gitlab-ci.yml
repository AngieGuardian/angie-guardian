default:
  # Pinned (not golang:latest) so builds are reproducible and the toolchain
  # picks up stdlib security fixes deliberately. Bump when a newer patch
  # release lands, especially when govulncheck flags a std vuln fixed in it.
  image: golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3

  # Every job is cancellable by default, so pushing again to a branch (or main)
  # frees the runners instead of finishing a pipeline for a commit nobody cares
  # about any more. GitLab's own default is `interruptible: false`, hence the
  # blanket true here. Jobs that publish something the world can see override it
  # back to false individually below: cancelling those halfway leaves a partial
  # release or a partly-deployed site.
  interruptible: true

  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  # Build metadata stamped into the binaries.
  LDFLAGS: "-X main.version=$CI_COMMIT_SHORT_SHA"
  # Package registry + release-asset endpoints for the release job.
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/angie-guardian/${CI_COMMIT_TAG}"
  RELEASE_LINKS_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
  # GitHub mirror. The repository itself is push-mirrored by GitLab; the release
  # job additionally publishes the built archives there as a GitHub release.
  # $GH_TOKEN (with Contents and Packages write access) comes from the
  # masked+protected CI/CD variable. The gh CLI reads it implicitly; the
  # container release job also uses it to authenticate to GHCR.
  GH_REPO: "AngieGuardian/angie-guardian"
  # GitHub Container Registry mirror.
  GHCR_REGISTRY: "ghcr.io"
  GHCR_USERNAME: "melroy89"
  GHCR_IMAGE: "ghcr.io/angieguardian/angie-guardian"
  # Pinned like govulncheck below; bump deliberately.
  GH_CLI_VERSION: "2.96.0"
  # Public trust anchor for release checksums. The matching signing-only secret
  # subkey is supplied to protected tag jobs through CI/CD variables; never
  # store the primary private key in GitLab.
  RELEASE_GPG_FINGERPRINT: "E0C7C029005B0CE6A7438BD571D11FF23454B9D7"
  # Official multi-architecture Cosign image, pinned by manifest digest.
  COSIGN_IMAGE: "ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8"

# Branch pipelines only. Without this, the `rules:` on the docs job makes
# GitLab also attempt a (job-less, thus failed) merge-request pipeline for
# every MR next to the branch pipeline that does the real work.
workflow:
  # Superseded pipelines get out of the way: a new commit on the same ref
  # cancels the running pipeline's interruptible jobs. `interruptible` (rather
  # than the stock `conservative`) is what makes this work on main, where the
  # long e2e job is usually still running when the next commit lands —
  # `conservative` would refuse to cancel anything as soon as one
  # non-interruptible job had started. Jobs opt out individually with
  # `interruptible: false`.
  auto_cancel:
    on_new_commit: interruptible
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - when: always

stages:
  - test
  - build
  - deploy
  - release

format:
  stage: test
  script:
    # gofmt must leave nothing to change. Scope it to our own source dirs, not
    # the module cache (GOPATH lives under $CI_PROJECT_DIR/.go, and gofmt -l .
    # would otherwise flag unformatted files inside vendored dependencies).
    - GOFMT_OUT=$(gofmt -l cmd core internal transport web test) || true
    - test -z "$GOFMT_OUT" || { echo 'gofmt needed on:'; echo "$GOFMT_OUT"; exit 1; }
    - go vet ./...
    # Also vet the e2e-tagged suite so it can never silently fail to compile
    # (it is excluded from the plain `./...` build by its //go:build e2e tag).
    - go vet -tags e2e ./test/e2e/...

test:
  stage: test
  script:
    - go test -race -count=1 ./...
    - make install-test

# Rebuild the pinned PHC Argon2 reference source with the pinned Emscripten
# toolchain, verify the content-addressed artifacts byte-for-byte, and reject a
# WASM payload over 300 KiB. This keeps a dependency or flag change from
# quietly turning the challenge page into a flood bandwidth amplifier.
argon2-wasm:
  stage: test
  image:
    name: emscripten/emsdk:4.0.10@sha256:90b757eb11fa9a0e3ce4d2d9f76d932a56018e4accc37b5a28b2783751e60eb7
    entrypoint: [""]
  cache: []
  script:
    - ./scripts/build-argon2-wasm.sh

# Hot-path allocation regression gate. allocs/op at a fixed iteration count is
# deterministic and machine-independent, so it can gate a pipeline where ns/op
# cannot (CI machines are far too noisy). A commit that adds an allocation to
# the auth or challenge hot path fails here in seconds instead of surfacing as
# a throughput drop months later. Baselines live in allocs-baseline.txt and are
# raised only deliberately, in the same commit as the change that needs it.
bench-allocs:
  stage: test
  script:
    - make bench-regress

# Fail the pipeline on any known-vulnerable dependency that our code actually
# reaches (govulncheck is call-graph aware, so it does not flag unused vulnerable
# symbols). Fast — seconds — so it runs on every push. The tool version is
# pinned for reproducibility; bump it deliberately.
govulncheck:
  stage: test
  # A reachable vulnerability is a release blocker. Clear a stdlib finding by
  # bumping the pinned Go image; clear an imported-package finding by updating
  # the dependency (or add an explicit, reviewed, expiring exception).
  script:
    - go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
    - $GOPATH/bin/govulncheck ./...

# Validate the shipped Prometheus rules (deploy/alerts.yaml) and their unit
# tests. These are release artifacts an operator loads verbatim, so a typo'd
# expression or a rule that silently stops firing must fail the pipeline rather
# than wait for a developer who happens to have promtool installed. The image
# is pinned by version AND digest like every other one here; its entrypoint is
# cleared because it defaults to running the Prometheus server.
alerts:
  stage: test
  image:
    name: prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    entrypoint: [""]
  cache: []
  script:
    - cd deploy
    - promtool check rules alerts.yaml
    - promtool test rules alerts.test.yaml

# Build-check the VitePress documentation site on branches that touch it, so
# a broken docs change (dead link, bad config) fails the MR instead of the
# Pages deploy on main. VitePress link checking runs as part of the build.
docs:
  stage: test
  image: node:24@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
  cache:
    key: vitepress
    paths:
      - docs/node_modules/
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - .gitlab-ci.yml
  script:
    - cd docs
    - npm ci
    - npm run build

# End-to-end suite: boots the real Angie + guardiand + whoami compose stack
# (deploy/docker/compose.yaml) via testcontainers-go and drives traffic
# through Angie. It needs a real Docker daemon, so it runs on the
# shell-executor runner (tag `shell`), not the unprivileged shared runners.
# The suite itself runs in a golang container that shares the host's docker
# socket and network namespace. Details that matter:
#   - the repo is mounted at its own host path, so the compose file's
#     relative bind mounts (resolved by the host daemon) land on the same
#     files the client sees;
#   - TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1 points the health-check probes
#     at the loopback, where compose publishes; inside a container
#     testcontainers would otherwise probe the bridge gateway IP and time out;
#   - Go module/build caches persist across runs in named volumes on the
#     runner host (not GitLab's cache, which shell runners handle poorly).
e2e:
  stage: test
  tags:
    - shell
  cache: []
  # The `shell` runners are protected (ref_protected), so they only pick up
  # jobs on protected refs (the default branch and tags). On an unprotected
  # feature branch this job would be created but never assigned a runner,
  # leaving it stuck pending and the whole pipeline hanging. Gate it to
  # protected refs so it simply is not created on feature branches; it runs on
  # main (and tags) where a protected shell runner can execute it.
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_REF_PROTECTED == "true"
  script:
    # --userns=host: the runner daemon uses userns-remap, which forbids
    # --network host unless the container opts back into the host user
    # namespace. A no-op on daemons without remapping.
    # Ryuk (testcontainers' cleanup reaper) must be disabled here: it mounts
    # the docker socket inside its own container, which userns-remap forbids,
    # so it dies before logging "Started" and the suite aborts. The harness
    # tears its stack down itself (compose down -v in a defer); ryuk would
    # only matter if the test process were SIGKILLed mid-run.
    - docker run --rm --network host --userns=host
      -e TESTCONTAINERS_HOST_OVERRIDE=127.0.0.1
      -e TESTCONTAINERS_RYUK_DISABLED=true
      -v /var/run/docker.sock:/var/run/docker.sock
      -v "$CI_PROJECT_DIR:$CI_PROJECT_DIR"
      -w "$CI_PROJECT_DIR"
      -v angie-guardian-e2e-gomod:/go/pkg/mod
      -v angie-guardian-e2e-gocache:/root/.cache
      golang:1.26.6-trixie@sha256:ab563819a16cfe5faff0f96a8bb598fbb0e400ab2ac751996e60abcb23b106a3
      make e2e

# NOTE: the fuzz targets (see `make fuzz`) are intentionally NOT a CI job.
# They found nothing after a thorough local sweep, and running every target
# for long enough to be worthwhile costs ~18 min of runner time per run for a
# codebase this size — not worth it on a schedule. Run `make fuzz` locally
# when touching a parser (URI decode, WAF rules, config, anomaly model, PoW
# redeem); commit any crasher under testdata/fuzz/ as a regression seed.

build:
  stage: build
  script:
    - go build -ldflags "$LDFLAGS" -o dist/guardiand ./cmd/guardiand
    - go build -ldflags "$LDFLAGS" -o dist/guardian-train ./cmd/guardian-train
    - go build -ldflags "$LDFLAGS" -o dist/guardian-loadtest ./cmd/guardian-loadtest
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Compile the optional http-wasm guest so it can never silently break. It is
# build-tagged (//go:build wasip1), so it does not affect the normal build,
# test or sidecar jobs above.
wasm:
  stage: build
  script:
    - GOOS=wasip1 GOARCH=wasm go build -ldflags "$LDFLAGS" -o dist/guardian.wasm ./transport/wasm
  artifacts:
    paths:
      - dist/guardian.wasm
    expire_in: 1 week

# --- Upload artifacts & attach to the release (tags only) ------------------
# This job does NOT create a release — you create the release in the GitLab
# UI. On a tag it cross-compiles per platform, tars each up, uploads them to
# the project's generic package registry, then POSTs release asset links to
# the release you created. The tag is stamped in as the binary version.
upload_and_release:
  stage: deploy
  # Never cancel a publish in progress. Recutting a tag (delete + push the same
  # name) starts a second pipeline on the same ref, and killing the first one
  # mid-upload would leave a half-populated package registry and a release with
  # some asset links attached and others missing.
  interruptible: false
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_TAG
  script:
    - export CGO_ENABLED=0
    # The optional WASM module is architecture-independent; build it once and
    # bundle it into each archive alongside the native binaries.
    - GOOS=wasip1 GOARCH=wasm go build -ldflags "-X main.version=$CI_COMMIT_TAG" -o guardian.wasm ./transport/wasm
    # Build + package one archive per platform. The three native binaries are
    # built exactly as before; guardian.wasm is added alongside them.
    - |
      for GOARCH in amd64 arm64; do
        PKG="angie-guardian-${CI_COMMIT_TAG}-linux-${GOARCH}"
        mkdir -p "$PKG"
        GOOS=linux GOARCH="$GOARCH" go build -ldflags "-X main.version=$CI_COMMIT_TAG" -o "$PKG/guardiand"         ./cmd/guardiand
        GOOS=linux GOARCH="$GOARCH" go build -ldflags "-X main.version=$CI_COMMIT_TAG" -o "$PKG/guardian-train"    ./cmd/guardian-train
        GOOS=linux GOARCH="$GOARCH" go build -ldflags "-X main.version=$CI_COMMIT_TAG" -o "$PKG/guardian-loadtest" ./cmd/guardian-loadtest
        cp guardian.wasm "$PKG/"
        cp -r README.md ARCHITECTURE.md USAGE.md LICENSE guardian.example.yaml deploy "$PKG/"
        mkdir -p "$PKG/assets"
        cp web/vendor/guardian-argon2/* "$PKG/assets/"
        tar -czf "${PKG}.tar.gz" "$PKG"
      done
    # Smoke the exact host-install inputs before publishing them. This catches
    # packaging drift (missing config/rules/unit) and prevents a release from
    # regressing the read-only /etc + writable /var/lib layout documented by
    # Getting Started. The runner is amd64, so execute that archive's daemon;
    # the arm64 archive is assembled by the identical loop above.
    - |
      ARCHIVE_PKG="angie-guardian-${CI_COMMIT_TAG}-linux-amd64"
      SMOKE_ROOT="$(mktemp -d)"
      tar -xzf "${ARCHIVE_PKG}.tar.gz" -C "$SMOKE_ROOT"
      PKG="$SMOKE_ROOT/$ARCHIVE_PKG"
      test -x "$PKG/guardiand"
      test -f "$PKG/guardian.example.yaml"
      test -f "$PKG/deploy/rules-common.yaml"
      test -f "$PKG/deploy/angie-guardian.conf"
      test -f "$PKG/deploy/angie-guardian-limits.conf"
      test -f "$PKG/deploy/angie-guardian-location.conf"
      test -f "$PKG/assets/argon2id-worker-db57362e2dddfb66.js"
      test -f "$PKG/assets/argon2id-runtime-1b3aa08f6d118ad6.js"
      test -f "$PKG/assets/argon2id-4507b469b9b103a5.wasm"
      test -f "$PKG/deploy/guardiand.service"
      test -x "$PKG/deploy/guardian-train-update"
      test -f "$PKG/deploy/guardian-train.env"
      test -f "$PKG/deploy/guardian-train.service"
      test -f "$PKG/deploy/guardian-train.timer"
      test -f "$PKG/deploy/alerts.yaml"
      grep -q '^signing_key_file: /var/lib/guardian/' "$PKG/guardian.example.yaml"
      grep -q '^  token_file: /var/lib/guardian/' "$PKG/guardian.example.yaml"
      grep -q '/etc/guardian/rules.d/common.yaml' "$PKG/guardian.example.yaml"
      grep -q '^StateDirectoryMode=0700$' "$PKG/deploy/guardiand.service"
      grep -q '^ConfigurationDirectoryMode=0710$' "$PKG/deploy/guardiand.service"
      ! grep -q '^ReadWritePaths=/etc/guardian' "$PKG/deploy/guardiand.service"

      RUNTIME_ROOT="$SMOKE_ROOT/runtime"
      mkdir -p "$RUNTIME_ROOT/etc/guardian/rules.d" "$RUNTIME_ROOT/var/lib/guardian"
      cp "$PKG/deploy/rules-common.yaml" "$RUNTIME_ROOT/etc/guardian/rules.d/common.yaml"
      sed -e "s#/etc/guardian/#$RUNTIME_ROOT/etc/guardian/#g" \
          -e "s#/var/lib/guardian/#$RUNTIME_ROOT/var/lib/guardian/#g" \
          "$PKG/guardian.example.yaml" > "$RUNTIME_ROOT/guardian.yaml"
      "$PKG/guardiand" -config "$RUNTIME_ROOT/guardian.yaml" -t
    # Export the Cosign public key supplied to the protected tag pipeline. It
    # is covered by the GPG-signed checksum list below, forming one trust chain
    # from the published GPG fingerprint to the container image.
    - printf '%s' "$COSIGN_PUBLIC_KEY_B64" | base64 --decode > cosign.pub
    - grep -q '^-----BEGIN PUBLIC KEY-----$' cosign.pub
    # Checksums over the exact archives and Cosign key being published.
    - sha256sum angie-guardian-${CI_COMMIT_TAG}-linux-amd64.tar.gz
      angie-guardian-${CI_COMMIT_TAG}-linux-arm64.tar.gz
      cosign.pub > SHA256SUMS
    - cat SHA256SUMS
    # Sign with a dedicated signing subkey chained to the public fingerprint
    # above. A throwaway GNUPGHOME prevents the runner image's keyring from
    # influencing the result or retaining the imported secret after the job.
    - |
      GNUPGHOME="$(mktemp -d)"
      export GNUPGHOME
      trap 'rm -rf "$GNUPGHOME"' EXIT
      chmod 700 "$GNUPGHOME"
      printf '%s' "$RELEASE_GPG_PRIVATE_KEY_B64" | base64 --decode > "$GNUPGHOME/release-secret.asc"
      chmod 600 "$GNUPGHOME/release-secret.asc"
      gpg --batch --import "$GNUPGHOME/release-secret.asc"
      gpg --batch --with-colons --fingerprint "$RELEASE_GPG_FINGERPRINT" \
        | grep -Fq "fpr:::::::::${RELEASE_GPG_FINGERPRINT}:"
      gpg --batch --list-secret-keys "$RELEASE_GPG_FINGERPRINT"
      gpg --batch --yes \
        --local-user "$RELEASE_GPG_FINGERPRINT" \
        --armor --detach-sign --output SHA256SUMS.asc SHA256SUMS
      gpg --batch --armor --export "$RELEASE_GPG_FINGERPRINT" > RELEASE-KEY.asc
      gpg --batch --verify SHA256SUMS.asc SHA256SUMS
      gpg --batch --show-keys --with-colons RELEASE-KEY.asc \
        | grep -Fq "fpr:::::::::${RELEASE_GPG_FINGERPRINT}:"
    # Upload all release files to the generic package registry.
    - |
      for ASSET in \
        angie-guardian-${CI_COMMIT_TAG}-linux-amd64.tar.gz \
        angie-guardian-${CI_COMMIT_TAG}-linux-arm64.tar.gz \
        SHA256SUMS SHA256SUMS.asc RELEASE-KEY.asc cosign.pub; do
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          --upload-file "$ASSET" "${PACKAGE_REGISTRY_URL}/${ASSET}"
      done
    # Attach the archives to the (already created) release as asset links.
    # !! In the reverse order of how they should be displayed !!
    - 'curl --fail --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "{\"name\":\"Angie Guardian release GPG public key\",\"url\":\"${PACKAGE_REGISTRY_URL}/RELEASE-KEY.asc\",\"link_type\":\"other\"}"
      ${RELEASE_LINKS_URL}'
    - 'curl --fail --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "{\"name\":\"Angie Guardian Cosign public key\",\"url\":\"${PACKAGE_REGISTRY_URL}/cosign.pub\",\"link_type\":\"other\"}"
      ${RELEASE_LINKS_URL}'
    - 'curl --fail --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "{\"name\":\"Angie Guardian ${CI_COMMIT_TAG} - GPG signature\",\"url\":\"${PACKAGE_REGISTRY_URL}/SHA256SUMS.asc\",\"link_type\":\"other\"}"
      ${RELEASE_LINKS_URL}'
    - 'curl --fail --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "{\"name\":\"Angie Guardian ${CI_COMMIT_TAG} - SHA256 checksums\",\"url\":\"${PACKAGE_REGISTRY_URL}/SHA256SUMS\",\"link_type\":\"other\"}"
      ${RELEASE_LINKS_URL}'
    - 'curl --fail --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "{\"name\":\"Angie Guardian ${CI_COMMIT_TAG} - Linux arm64 (.tar.gz)\",\"url\":\"${PACKAGE_REGISTRY_URL}/angie-guardian-${CI_COMMIT_TAG}-linux-arm64.tar.gz\",\"link_type\":\"package\"}"
      ${RELEASE_LINKS_URL}'
    - 'curl --fail --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "{\"name\":\"Angie Guardian ${CI_COMMIT_TAG} - Linux amd64 (.tar.gz)\",\"url\":\"${PACKAGE_REGISTRY_URL}/angie-guardian-${CI_COMMIT_TAG}-linux-amd64.tar.gz\",\"link_type\":\"package\"}"
      ${RELEASE_LINKS_URL}'
    # --- GitHub mirror ------------------------------------------------------
    # Publish the same archives as a GitHub release on $GH_REPO. Runs last, so
    # a GitHub outage or an expired token cannot prevent the GitLab assets
    # above from being published. The golang image has no `gh`, so fetch the
    # pinned CLI tarball (the shared runners are amd64).
    #
    # create-or-upload: `create` fails if the release already exists (a retried
    # job, or one made by hand), in which case `upload --clobber` attaches the
    # assets to it instead. That makes re-running this job idempotent.
    #
    # --target pins the release to this commit so GitHub creates the tag itself
    # if the (asynchronous) push mirror has not delivered it yet.
    - |
      curl -fsSL "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/gh_${GH_CLI_VERSION}_linux_amd64.tar.gz" \
        | tar -xz -C /tmp
      export PATH="/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin:$PATH"
      gh release create "$CI_COMMIT_TAG" \
        angie-guardian-${CI_COMMIT_TAG}-linux-amd64.tar.gz \
        angie-guardian-${CI_COMMIT_TAG}-linux-arm64.tar.gz \
        SHA256SUMS SHA256SUMS.asc RELEASE-KEY.asc cosign.pub \
        --repo "$GH_REPO" \
        --target "$CI_COMMIT_SHA" \
        --title "v$CI_COMMIT_TAG" \
        --notes "Angie Guardian $CI_COMMIT_TAG" || \
      gh release upload "$CI_COMMIT_TAG" \
        angie-guardian-${CI_COMMIT_TAG}-linux-amd64.tar.gz \
        angie-guardian-${CI_COMMIT_TAG}-linux-arm64.tar.gz \
        SHA256SUMS SHA256SUMS.asc RELEASE-KEY.asc cosign.pub \
        --repo "$GH_REPO" \
        --clobber
  # Keep the built archives downloadable from the pipeline for a short while,
  # so a failed GitHub step can be recovered with a manual upload instead of a
  # rebuild.
  artifacts:
    paths:
      - angie-guardian-*.tar.gz
      - SHA256SUMS
      - SHA256SUMS.asc
      - RELEASE-KEY.asc
      - cosign.pub
    expire_in: 1 month

# --- Container image (tags only) --------------------------------------------
# Builds the sidecar image from deploy/docker/Dockerfile and pushes the same
# versioned and latest tags to the GitLab registry and GHCR. Runs
# on the shell-executor runner (tag `shell`), which has a real Docker daemon,
# because the shared runners cannot run docker builds (no privileged dind).
docker-release:
  stage: release
  tags:
    - shell
  # The shell executor ignores the default golang image; drop the Go module
  # cache too, this job only drives docker.
  cache: []
  # Same reasoning as upload_and_release: a cancelled push can leave the
  # registry with `:latest` pointing at a different build than `:<tag>`.
  interruptible: false
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_TAG
  script:
    # Pre-pull the base images through the daemon and build WITHOUT --pull:
    # BuildKit's own registry resolver reliably stalls on this host fetching
    # the 32-byte OCI empty blob (sha256:4f4fb700...) that the base images'
    # attestation manifests reference; the daemon's classic pull path never
    # requests it, and without --pull the FROMs resolve from the local store.
    # The images are read from the Dockerfile so they can never drift.
    - |
      COSIGN_WORK_DIR="$(mktemp -d)"
      trap 'rm -rf "$COSIGN_WORK_DIR"' EXIT
      export DOCKER_CONFIG="$COSIGN_WORK_DIR/docker"
      mkdir -p "$DOCKER_CONFIG"

      registry_login() {
        printf '%s' "$CI_REGISTRY_PASSWORD" \
          | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        printf '%s' "$GH_TOKEN" \
          | docker login -u "$GHCR_USERNAME" --password-stdin "$GHCR_REGISTRY"
      }

      awk '/^FROM /{print $2}' deploy/docker/Dockerfile | xargs -n1 docker pull
      docker build \
        -f deploy/docker/Dockerfile \
        --build-arg VERSION="$CI_COMMIT_TAG" \
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" \
        -t "$CI_REGISTRY_IMAGE:latest" \
        -t "$GHCR_IMAGE:$CI_COMMIT_TAG" \
        -t "$GHCR_IMAGE:latest" \
        .

      # Match the established dual-registry release pattern: authenticate
      # immediately before pushing so a long build cannot leave stale sessions.
      registry_login
      docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      docker push "$CI_REGISTRY_IMAGE:latest"
      docker push "$GHCR_IMAGE:$CI_COMMIT_TAG"
      docker push "$GHCR_IMAGE:latest"

      # Resolve and sign immutable registry-specific references, never mutable
      # tags. The same manifest backs :latest in each registry.
      resolve_digest() {
        local tagged_image="$1" repository="$2"
        docker pull "$tagged_image" >&2
        docker image inspect \
          --format '{{range .RepoDigests}}{{println .}}{{end}}' \
          "$tagged_image" \
          | grep -F "${repository}@sha256:" | head -n1
      }
      GITLAB_IMAGE_DIGEST="$(resolve_digest \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" "$CI_REGISTRY_IMAGE")"
      GHCR_IMAGE_DIGEST="$(resolve_digest \
        "$GHCR_IMAGE:$CI_COMMIT_TAG" "$GHCR_IMAGE")"
      test -n "$GITLAB_IMAGE_DIGEST"
      test -n "$GHCR_IMAGE_DIGEST"

      # A registry may canonicalize the pushed manifest differently, so the
      # digest can differ across registries even though the image layers and
      # configuration are the same. Sign exactly what each registry serves.

      COSIGN_PRIVATE_KEY="$(printf '%s' "$COSIGN_PRIVATE_KEY_B64" | base64 --decode)"
      COSIGN_PUBLIC_KEY="$(printf '%s' "$COSIGN_PUBLIC_KEY_B64" | base64 --decode)"
      export COSIGN_PRIVATE_KEY COSIGN_PUBLIC_KEY

      cosign() {
        # Cosign encrypts even a passwordless generated key and otherwise
        # tries to prompt on a non-interactive runner. This is an explicit
        # empty value, not a GitLab secret variable.
        docker run --rm \
          --user 0:0 \
          --env COSIGN_PASSWORD= \
          --env COSIGN_PRIVATE_KEY \
          --env COSIGN_PUBLIC_KEY \
          "$COSIGN_IMAGE" "$@"
      }
      DERIVED_PUBLIC_KEY="$(cosign public-key --key env://COSIGN_PRIVATE_KEY)"
      test "$DERIVED_PUBLIC_KEY" = "$COSIGN_PUBLIC_KEY"
      sign_and_verify() {
        local image_digest="$1" registry_user="$2" registry_password="$3"
        cosign sign --yes \
          --key env://COSIGN_PRIVATE_KEY \
          --registry-username "$registry_user" \
          --registry-password "$registry_password" \
          -a "git_sha=$CI_COMMIT_SHA" \
          -a "version=$CI_COMMIT_TAG" \
          "$image_digest"
        cosign verify --key env://COSIGN_PUBLIC_KEY \
          --registry-username "$registry_user" \
          --registry-password "$registry_password" \
          -a "git_sha=$CI_COMMIT_SHA" \
          -a "version=$CI_COMMIT_TAG" \
          "$image_digest"
      }
      sign_and_verify "$GITLAB_IMAGE_DIGEST" \
        "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD"
      sign_and_verify "$GHCR_IMAGE_DIGEST" \
        "$GHCR_USERNAME" "$GH_TOKEN"
      unset COSIGN_PRIVATE_KEY COSIGN_PUBLIC_KEY
      docker logout "$CI_REGISTRY"
      docker logout "$GHCR_REGISTRY"

# --- Documentation site (angieguardian.org) ---------------------------------
# Builds the VitePress site from docs/ and publishes it as a `public/`
# artifact. This is NOT GitLab Pages: the artifact is picked up by the external
# artifact deployer, which watches for deployment jobs via webhook and pushes
# the site to https://angieguardian.org. The `environment:` block below is what
# makes this a deployment job (and therefore what triggers the webhook), so it
# must stay even though nothing here talks to the server directly. The site is
# served from the domain root, so the VitePress base stays at its default `/`
# (no DOCS_BASE override, unlike the old Pages subpath build).
docs-deploy:
  stage: deploy
  image: node:24@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059
  # A deployment job: cancelling it once the artifact webhook has fired would
  # leave angieguardian.org mid-publish. Two docs commits in quick succession
  # both deploy, in order, rather than the first being killed.
  interruptible: false
  cache:
    key: vitepress
    paths:
      - docs/node_modules/
  # Only redeploy when the site (or this job's own definition) actually
  # changes, so a Go-only commit does not rebuild and re-publish an identical
  # site. `.gitlab-ci.yml` is watched too: without it, a change to the build
  # steps below would never reach production.
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - docs/**/*
        - .gitlab-ci.yml
  script:
    - cd docs
    - npm ci
    - npm run build
    # The deployer expects the site at the top level of the artifact, so lift
    # it out of docs/.vitepress/ and into ./public at the repo root.
    - mv .vitepress/dist "$CI_PROJECT_DIR/public"
  environment:
    name: website
    url: https://angieguardian.org
  artifacts:
    name: "Angie Guardian website $CI_COMMIT_SHORT_SHA"
    expire_in: 1 month
    paths:
      - public

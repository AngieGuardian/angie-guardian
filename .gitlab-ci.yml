default:
  image: golang:latest

  cache:
    key:
      files:
        - go.mod
    paths:
      - .go/pkg/mod/

variables:
  GOPATH: $CI_PROJECT_DIR/.go
  # Build metadata stamped into the binaries.
  LDFLAGS: "-X main.version=$CI_COMMIT_SHORT_SHA"
  # Package registry + release-asset endpoints for the release job.
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/angie-guardian/${CI_COMMIT_TAG}"
  RELEASE_LINKS_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

stages:
  - test
  - build
  - deploy

format:
  stage: test
  script:
    # gofmt must leave nothing to change. Scope it to our own source dirs, not
    # the module cache (GOPATH lives under $CI_PROJECT_DIR/.go, and gofmt -l .
    # would otherwise flag unformatted files inside vendored dependencies).
    - GOFMT_OUT=$(gofmt -l cmd core transport web test) || true
    - test -z "$GOFMT_OUT" || { echo 'gofmt needed on:'; echo "$GOFMT_OUT"; exit 1; }
    - go vet ./...
    # Also vet the e2e-tagged suite so it can never silently fail to compile
    # (it is excluded from the plain `./...` build by its //go:build e2e tag).
    - go vet -tags e2e ./test/e2e/...

test:
  stage: test
  script:
    - go test -race -count=1 ./...

# End-to-end suite against a REAL Angie: boots deploy/docker/compose.yaml
# (Angie + guardiand + whoami) with testcontainers-go and drives it through
# Angie. Runs in docker-in-docker so testcontainers has a Docker daemon; kept
# separate from the fast unit `test` job so unit runs stay quick and daemon-free.
e2e:
  stage: test
  image: golang:1.25
  services:
    - docker:dind
  variables:
    DOCKER_HOST: "tcp://docker:2375"
    DOCKER_TLS_CERTDIR: ""            # plain-HTTP dind (no TLS) for simplicity
    TESTCONTAINERS_RYUK_DISABLED: "true"  # dind tears itself down; Ryuk can't reap across it
  before_script:
    # Wait for the dind daemon to accept connections before the test starts.
    # The golang image ships neither the docker CLI nor netcat (the old probe
    # using them retry-spun forever), so probe the TCP port with bash's
    # built-in /dev/tcp — no extra packages. Run it under bash explicitly:
    # the image's /bin/sh is dash, which has no /dev/tcp and would spin the
    # whole loop then fall through. testcontainers talks to the daemon over
    # DOCKER_HOST directly once it is up.
    - |
      bash -c 'for i in $(seq 1 60); do
        if (exec 3<>/dev/tcp/docker/2375) 2>/dev/null; then exec 3>&-; echo "dind up after ${i}s"; exit 0; fi
        sleep 1
      done; echo "dind did not come up in 60s" >&2; exit 1'
  script:
    - go test -tags e2e -count=1 -timeout 20m ./test/e2e/...
  # Docker-in-docker isn't available on every runner; allow-fail keeps a missing
  # dind runner from blocking the pipeline while still surfacing real failures.
  allow_failure: true

build:
  stage: build
  script:
    - go build -ldflags "$LDFLAGS" -o dist/guardiand ./cmd/guardiand
    - go build -ldflags "$LDFLAGS" -o dist/guardian-train ./cmd/guardian-train
    - go build -ldflags "$LDFLAGS" -o dist/guardian-loadtest ./cmd/guardian-loadtest
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# Compile the optional http-wasm guest so it can never silently break. It is
# build-tagged (//go:build wasip1), so it does not affect the normal build,
# test or sidecar jobs above.
wasm:
  stage: build
  script:
    - GOOS=wasip1 GOARCH=wasm go build -ldflags "$LDFLAGS" -o dist/guardian.wasm ./transport/wasm
  artifacts:
    paths:
      - dist/guardian.wasm
    expire_in: 1 week

# --- Upload artifacts & attach to the release (tags only) ------------------
# This job does NOT create a release — you create the release in the GitLab
# UI. On a tag it cross-compiles per platform, tars each up, uploads them to
# the project's generic package registry, then POSTs release asset links to
# the release you created. The tag is stamped in as the binary version.
upload_and_release:
  stage: deploy
  rules:
    - if: $CI_PROJECT_NAMESPACE == "melroy" && $CI_COMMIT_TAG
  script:
    - export CGO_ENABLED=0
    # The optional WASM module is architecture-independent; build it once and
    # bundle it into each archive alongside the native binaries.
    - GOOS=wasip1 GOARCH=wasm go build -ldflags "-X main.version=$CI_COMMIT_TAG" -o guardian.wasm ./transport/wasm
    # Build + package one archive per platform. The three native binaries are
    # built exactly as before; guardian.wasm is added alongside them.
    - |
      for GOARCH in amd64 arm64; do
        PKG="angie-guardian-${CI_COMMIT_TAG}-linux-${GOARCH}"
        mkdir -p "$PKG"
        GOOS=linux GOARCH="$GOARCH" go build -ldflags "-X main.version=$CI_COMMIT_TAG" -o "$PKG/guardiand"         ./cmd/guardiand
        GOOS=linux GOARCH="$GOARCH" go build -ldflags "-X main.version=$CI_COMMIT_TAG" -o "$PKG/guardian-train"    ./cmd/guardian-train
        GOOS=linux GOARCH="$GOARCH" go build -ldflags "-X main.version=$CI_COMMIT_TAG" -o "$PKG/guardian-loadtest" ./cmd/guardian-loadtest
        cp guardian.wasm "$PKG/"
        cp -r README.md USAGE.md LICENSE guardian.example.yaml deploy "$PKG/"
        tar -czf "${PKG}.tar.gz" "$PKG"
      done
    # Upload each archive to the generic package registry.
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file angie-guardian-${CI_COMMIT_TAG}-linux-amd64.tar.gz
      ${PACKAGE_REGISTRY_URL}/angie-guardian-${CI_COMMIT_TAG}-linux-amd64.tar.gz'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --upload-file angie-guardian-${CI_COMMIT_TAG}-linux-arm64.tar.gz
      ${PACKAGE_REGISTRY_URL}/angie-guardian-${CI_COMMIT_TAG}-linux-arm64.tar.gz'
    # Attach the archives to the (already created) release as asset links.
    # !! In the reverse order of how they should be displayed !!
    - 'curl --fail --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "{\"name\":\"Angie Guardian ${CI_COMMIT_TAG} - Linux arm64 (.tar.gz)\",\"url\":\"${PACKAGE_REGISTRY_URL}/angie-guardian-${CI_COMMIT_TAG}-linux-arm64.tar.gz\",\"link_type\":\"package\"}"
      ${RELEASE_LINKS_URL}'
    - 'curl --fail --request POST
      --header "JOB-TOKEN: $CI_JOB_TOKEN"
      --header "Content-Type: application/json"
      --data "{\"name\":\"Angie Guardian ${CI_COMMIT_TAG} - Linux amd64 (.tar.gz)\",\"url\":\"${PACKAGE_REGISTRY_URL}/angie-guardian-${CI_COMMIT_TAG}-linux-amd64.tar.gz\",\"link_type\":\"package\"}"
      ${RELEASE_LINKS_URL}'

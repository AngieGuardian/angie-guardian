# Demo/seeding config for `make seed` — NOT a production example.
# See guardian.example.yaml for that; this one is tuned to make every dashboard
# surface light up quickly on a throwaway instance.
#
#   guardiand -config test/seed/guardian.seed.yaml     # from the repo root
#   make seed                                          # in another shell
#
# Deliberate choices:
#   trusted_proxy   the seeder stands in for Angie and sets X-Guardian-* itself
#   base_difficulty low, so solving thousands of challenges takes seconds
#   memory store    throwaway state; no container and nothing to clean up
#   admin.token     a fixed dev token so the dashboard link below just works
#
# Dashboard: http://127.0.0.1:18072/admin/dashboard#token=seed-demo-token

listen: 127.0.0.1:18071
log_level: warn
trusted_proxy: true

# Generated on first start next to this file; delete to rotate.
signing_key_file: test/seed/.seed-ed25519.key

store:
  backend: memory

# Committed demo fixtures (regenerate with `go generate ./test/seed`): they
# map the seeder's documentation ranges to a spread of countries/cities/ASNs,
# so the Geo columns, the world map, the country rollup and the IP lookup
# panel all light up. Paths are relative to the repo root, like rules_file.
geoip:
  location_db: test/seed/seed-city.mmdb
  asn_db: test/seed/seed-asn.mmdb

# One local demo feed: the seeder sends traffic from its range, producing
# reputation:demo-blocklist denies and feed-hit chips in the IP lookup.
reputation:
  feeds:
    - name: demo-blocklist
      file: test/seed/seed-blocklist.txt
      action: deny

admin:
  listen: 127.0.0.1:18072
  token: seed-demo-token
  dashboard: true

defaults:
  # A statically denied range, so the seeder can produce denylist:ip decisions
  # (TEST-NET-3, reserved for documentation, so it can never be a real client).
  denylist:
    ips: [ "203.0.113.240/28" ]
  # Opt every domain in to the demo feed above.
  reputation:
    enabled: true
  pow:
    enabled: true
    base_difficulty: 4
    max_difficulty: 8
  waf:
    keywords:
      enabled: true
      # The shipped starter rules: the seeder's scanner traffic is built to
      # match these, so denies and blocks appear without extra setup.
      rules_file: deploy/rules-common.yaml
    ip_behaviour:
      enabled: true
      block_ttl: 30m
    # Trap paths no legitimate client visits: one hit denies and (with
    # ip_behaviour on) persists a block, so the seeder can produce honeypot
    # decisions alongside the signature ones.
    honeypot:
      enabled: true
      paths: [ "/admin-old/", "/wp-admin-backup/" ]

domains:
  # Proof of work off here, so this host supplies the allowed traffic that
  # gives the per-domain chart its green band.
  plain.test:
    pow: { enabled: false }
  # The three hosts the seeder sends traffic to. They would work undeclared
  # (defaults apply to every host), but then every metric would label them
  # "default" and the per-domain charts would collapse to a single row.
  example.com: {}
  blog.example.com: {}
  # Deliberately the expensive one, at +2 bits (each quarter step on the config
  # scale is one bit, so 4.5 is four times the work of the 4 above). It is what
  # the "solve time by domain" card exists to make obvious.
  shop.example.com:
    pow: { base_difficulty: 4.5 }

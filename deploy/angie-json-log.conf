# JSON access log format for protected vhosts (http {} context).
#
# The guardian-train offline anomaly pipeline (P3) consumes this format;
# switch protected vhosts to it now so logs accumulate for training:
#   access_log /var/log/angie/example.com.access.json guardian_json;

log_format guardian_json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"guardian_action":"$guardian_action"'
'}';

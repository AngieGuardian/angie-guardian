# Starter WAF signature rules for Angie Guardian.
# Copy to /etc/guardian/rules.d/common.yaml (or wherever waf.keywords.rules_file
# points) and tune per site. The file is hot-reloaded: edits apply within
# seconds, and a file that fails to parse keeps the previous rules active.
#
# Rule fields:
#   id:          unique name, shows up in logs as waf:<id>
#   action:      deny (default) | challenge (a valid bound token satisfies it;
#                without PoW it denies) | block (deny + persist the IP only
#                when waf.ip_behaviour is enabled)
#   targets:     any of [path, query, ua, "header:<name>"]; default [path, query]
#   methods:     restrict the rule to these HTTP methods; a rule with methods
#                but no keywords/regexes fires on the method alone
#   keywords:    non-empty case-insensitive literal substrings. All targets are
#                lowercased; path/query and every targeted header value are
#                percent-decoded, while User-Agent is not decoded. Every
#                duplicate header value is inspected.
#   regexes:     non-empty Go RE2 syntax — linear-time, no ReDoS risk. Inputs
#                are lowercased; use lowercase patterns or an explicit (?i).
# Rules are evaluated in file order and the first match wins. Put narrow or
# terminal rules before broad challenge rules.
#
# Request bodies are never inspected: Angie's auth_request subrequest carries
# only the request line and headers, by design. Body-borne payloads are the
# backend's input validation (or a full inline WAF's) to handle.

rules:
  - id: dotfile-probe
    description: Dotfiles are never served legitimately; fetching them is scanning
    action: block
    targets: [ path ]
    keywords: [ "/.env", "/.git/", "/.aws/", "/.ssh/", "/.htpasswd", "/.svn/" ]

  - id: wp-probe
    description: WordPress probes — REMOVE on actual WordPress sites!
    action: deny
    targets: [ path ]
    keywords: [ "/wp-login.php", "/xmlrpc.php", "/wp-config", "/wp-json/wp/v2/users" ]

  - id: path-traversal
    action: deny
    targets: [ path, query ]
    keywords: [ "../", "..\\", "%2e%2e/" ]

  - id: sqli-basic
    description: Cheap SQL injection heuristics; challenge rather than deny to spare false positives
    action: challenge
    targets: [ path, query ]
    regexes:
      - '(?i)\bunion\b[\s/*+]+(all[\s/*+]+)?select\b'
      - '(?i)\b(sleep|benchmark|pg_sleep)\s*\('
      - "(?i)['\"]\\s*or\\s+1\\s*=\\s*1"

  - id: scanner-ua
    description: Vulnerability scanners announce themselves in the User-Agent
    action: block
    targets: [ ua ]
    keywords: [ "sqlmap", "nikto", "masscan", "nuclei", "wpscan", "acunetix" ]

  - id: log4shell
    description: JNDI lookup probes arrive in URL-shaped headers as often as in the URI
    action: block
    targets: [ query, ua, "header:referer", "header:x-forwarded-for" ]
    keywords: [ "${jndi:" ]

  - id: trace-method
    description: TRACE/TRACK have no legitimate use on a production site
    action: deny
    methods: [ TRACE, TRACK ]

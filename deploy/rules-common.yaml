# Starter WAF rules for Angie Guardian.
# Copy to /etc/guardian/rules.d/common.yaml (or another path listed under
# waf.rules.files) and tune per site. The file is hot-reloaded: edits apply within
# seconds, and a file that fails to parse keeps the previous rules active. An
# update that removes or renames a rule id still listed in some scope's
# waf.rules.disabled_ids is rejected the same way (last-good rules
# stay active): drop the id from guardian.yaml and reload first, then delete
# the rule here.
#
# Rule fields:
#   id:          unique name, shows up in logs as waf:<id>. Also the exact,
#                case-sensitive selector for waf.rules.disabled_ids in
#                guardian.yaml, which disables the rule for one domain or path
#                scope instead of copying this file.
#   action:      allow (terminal at the WAF stage, no bad-event score) | deny
#                (default) | challenge (a valid bound token satisfies it;
#                without PoW it denies) | block (deny + persist the IP only
#                when waf.ip_behaviour is enabled)
#   targets:     any of [path, query, ua, "header:<name>"]; default [path, query]
#   methods:     restrict the rule to these HTTP methods; a rule with methods
#                but no keywords/regexes fires on the method alone
#   keywords:    non-empty case-insensitive literal substrings. All targets are
#                lowercased; path/query and every targeted header value are
#                percent-decoded, while User-Agent is not decoded. Every
#                duplicate header value is inspected.
#   regexes:     non-empty Go RE2 syntax — linear-time, no ReDoS risk. Inputs
#                are lowercased; use lowercase patterns or an explicit (?i).
# Effective files run in defaults/domain/path order; within each file, the first
# matching rule wins. Put narrow allow exceptions before broader rules in the
# same file. To override an earlier shared rule, disable its id for that scope.
#
# Request bodies are never inspected: Angie's auth_request subrequest carries
# only the request line and headers, by design. Body-borne payloads are the
# backend's input validation (or a full inline WAF's) to handle.

rules:
  - id: dotfile-probe
    description: Dotfiles, VCS paths, and local IDE metadata are never served legitimately
    action: block
    targets: [ path ]
    keywords:
      - "/.env"
      - "/.env.local"
      - "/.env.production"
      - "/.env.staging"
      - "/.env.backup"
      - "/.env.old"
      - "/.env.save"
      - "/.env.dev"
      - "/.git/"
      - "/.git-rewrite/"
      - "/.gitignore"
      - "/.aws/"
      - "/.ssh/"
      - "/.htpasswd"
      - "/.htaccess"
      - "/.user.ini"
      - "/.svn/"
      - "/.hg/"
      - "/.gitlab-ci.yml"
      - "/.github/"
      - "/.docker"
      - "/.dockercfg"
      - "/.npmrc"
      - "/.DS_Store"
      - "/.vscode/"
      - "/.idea/"
      - "/.bash_history"

  # Cloud infrastructure, IAM, and secret scanning
  - id: cloud-credentials-probe
    description: Probes for cloud provider secrets, IAM keys, service accounts, and Terraform state
    action: block
    targets: [ path ]
    keywords:
      - "/aws.json"
      - "/aws-ses.json"
      - "/aws.env"
      - "/aws.yml"
      - "/aws.ini"
      - "/aws_s3"
      - "/aws_config"
      - "/aws_credentials"
      - "/aws-secret.json"
      - "/credentials/aws.txt"
      - "/credentials/amazon.txt"
      - "/s3/bucket.env"
      - "/s3.json"
      - "/s3.env"
      - "/google-service-account.json"
      - "/gcp-credentials.json"
      - "/gcp-key.json"
      - "/azure-credentials.json"
      - "/azure.json"
      - "/terraform.tfstate"
      - "/terraform.tfstate.backup"
      - "/terraform.tfvars"
      - "/creds.json"
      - "/privatekey"
      - "/privatekey.json"
      - "/keyfile.json"
      - "/key.json"
      - "/stripe.env"
      - "/boto.cfg"
      - "/kube/config"

  # Container, serverless, and application configs
  - id: application-config-probe
    description: Probes for framework configuration, secret YAMLs, build lockfiles, and orchestrators
    action: block
    targets: [ path ]
    keywords:
      - "/docker-compose"
      - "/docker-compose.override.yml"
      - "/docker-compose.dev.yml"
      - "/serverless.json"
      - "/serverless.yml"
      - "/amplify.yml"
      - "/appsettings.json"
      - "/appsettings.development.json"
      - "/config.yaml"
      - "/config.yml"
      - "/config.json"
      - "/config.inc.php"
      - "/config.php.bak"
      - "/config.php.old"
      - "/application.yml"
      - "/secrets.yml"
      - "/config/database.yml"
      - "/config/secrets.yml"
      - "/config/mail.php"
      - "/config/smtp.php"
      - "/web.config"
      - "/composer.lock"
      - "/package-lock.json"
      - "/yarn.lock"

  # Database dumps and environment backups
  - id: database-backup-probe
    description: Direct requests for database exports, log dumps, and web server info scripts
    action: block
    targets: [ path ]
    keywords:
      - "/dump.sql"
      - "/backup.sql"
      - "/database.sql"
      - "/db.sqlite"
      - "/phpinfo.php"
      - "/info.php"

  # Full-site and database archive backups
  - id: archive-backup-probe
    description: Direct requests for compressed archives and raw backups at the web root
    action: block
    targets: [ path ]
    regexes:
      - '(?i)^/(backup\.zip|backup\.tar\.gz|backup\.tgz|site\.zip|www\.zip|webroot\.zip|dump\.tar\.gz)$'

  # Node.js and package manifest leaks
  - id: js-manifest-leak
    description: Probes for package manifests at the web root exposing dependency trees and scripts
    action: block
    targets: [ path ]
    regexes:
      - '(?i)^/(package\.json|pnpm-lock\.yaml|bun\.lockb)$'

  - id: wp-cms-probe
    description: Probes for common PHP CMS configuration leaks and entry points
    action: deny
    targets: [ path ]
    keywords:
      - "/wp-login.php"
      - "/xmlrpc.php"
      - "/wp-config"
      - "/wp-json/wp/v2/users"
      - "/configuration.php"
      - "/wp-admin/"

  # Spring Boot Actuator endpoints
  - id: spring-actuator-probe
    description: Exposure of Java Spring Boot management and memory dump endpoints
    action: block
    targets: [ path ]
    keywords:
      - "/actuator/env"
      - "/actuator/configprops"
      - "/actuator/heapdump"
      - "/actuator/health"
      - "/actuator/gateway"

  # Known Webshell & Backdoor filenames
  - id: webshell-probe
    description: Direct access attempts to common pre-installed PHP webshells and backdoors
    action: block
    targets: [ path ]
    keywords:
      - "/c99.php"
      - "/r57.php"
      - "/wso.php"
      - "/alfa.php"
      - "/shell.php"
      - "/cmd.php"
      - "/b374k.php"

  # Dedicated Scanner User-Agent blocklist (Excludes generic HTTP client libraries)
  - id: scanner-ua
    description: Dedicated security scanners and active recon tools announcing via User-Agent
    action: block
    targets: [ ua ]
    keywords:
      - "sqlmap"
      - "nikto"
      - "masscan"
      - "nuclei"
      - "wpscan"
      - "acunetix"
      - "zgrab"
      - "censys"
      - "shodan"
      - "nmap"
      - "dirbuster"
      - "gobuster"

  # Path traversal attempts
  - id: path-traversal
    action: deny
    targets: [ path, query ]
    keywords: [ "../", "..\\", "%2e%2e/", "%2e%2e%2f" ]

  # Linux process-memory and local-file inclusion probes
  - id: linux-proc-lfi
    description: Direct traversal attempts targeting Linux /proc environment and process nodes
    action: block
    targets: [ path, query ]
    keywords:
      - "/proc/self/environ"
      - "/proc/self/cmdline"
      - "/proc/self/status"

  # PHP stream pseudo-protocols used in local-file inclusion
  - id: php-stream-wrappers
    description: Detects PHP wrapper schemes used in LFI to read source files or execute payload data
    action: block
    targets: [ path, query ]
    keywords:
      - "php://filter"
      - "php://input"
      - "data://text/plain"

  # Command Injection Heuristics
  - id: cmd-injection-basic
    description: Basic OS command execution payloads targeting path or query string
    action: deny
    targets: [ path, query ]
    regexes:
      - '(?i)(;|\||`)\s*(cat|ls|id|whoami|uname|wget|curl|nc|bash|sh)\b'
      - '(?i)/etc/(passwd|shadow|issue|hosts)'

  # Cross-Site Scripting (XSS)
  - id: xss-basic
    description: Common inline script tags, JavaScript schemes, and DOM event listener payloads
    action: challenge
    targets: [ path, query ]
    regexes:
      - '(?i)<script\b[^>]*>'
      - '(?i)javascript\s*:'
      - '(?i)\bon(error|load|click|mouseover|submit)\s*='
      - '(?i)document\.cookie'

  # Remote File Inclusion (RFI) / Basic SSRF
  - id: rfi-ssrf-basic
    description: Attempts to inject external HTTP/FTP URLs into query parameters
    action: deny
    targets: [ query ]
    regexes:
      - '(?i)=\s*(https?|ftps?)://'

  # SQL Injection - Tautologies & Auth Bypasses
  - id: sqli-tautology
    description: Tautology patterns used to bypass login forms and WHERE clauses
    action: challenge
    targets: [ path, query ]
    regexes:
      - "(?i)['\"]\\s*(or|and)\\s+['\"]?1['\"]?\\s*=\\s*['\"]?1"
      - "(?i)['\"]\\s*(or|and)\\s+['\"]?[a-z0-9]+['\"]?\\s*=\\s*['\"]?[a-z0-9]+"
      - "(?i)['\"]\\s*or\\s+true\\b"
      - "(?i)\\badmin'\\s*--"

  # SQL Injection - Comments & Obfuscation Bypasses
  - id: sqli-comments
    description: Inline comments and MySQL comment hacks used to bypass simple string matching
    action: deny
    targets: [ path, query ]
    regexes:
      - "(?i)['\"].*?(--|#|/\\*)"
      - "(?i)/\\*!\\d+.*?\\*/"

  # SQL Injection - UNION & Data Exfiltration
  - id: sqli-union-select
    description: UNION-based queries attempting to extract cross-table data
    action: deny
    targets: [ path, query ]
    regexes:
      - "(?i)\\bunion\\b[\\s/*+]+(all[\\s/*+]+)?select\\b"
      - "(?i)\\bselect\\b[\\s/*+]+.*?\\bfrom\\b[\\s/*+]+"

  # SQL Injection - Schema Reconnaissance & Database Functions
  - id: sqli-recon-functions
    description: Probes targeting system tables, DB metadata, or XML error exploitation
    action: deny
    targets: [ path, query ]
    regexes:
      - "(?i)\\b(information_schema|sys\\.tables|sys\\.objects|pg_catalog|sqlite_master)\\b"
      - "(?i)\\b(extractvalue|updatexml|concat_ws)\\s*\\("
      - "(?i)\\b(user|version|database|schema|current_user)\\s*\\(\\s*\\)"

  # SQL Injection - Time-Based, Stacked Queries & OS Execution
  - id: sqli-time-stacked
    description: Blind time delays, stacked statement chaining, and MSSQL command calls
    action: deny
    targets: [ path, query ]
    regexes:
      - "(?i)\\b(sleep|benchmark|pg_sleep)\\s*\\("
      - "(?i)\\bwaitfor\\s+delay\\s+['\"]"
      - ";\\s*(declare|exec|execute|select|insert|update|delete|drop|alter)\\b"
      - "(?i)\\bxp_cmdshell\\b"

  # Log4Shell / JNDI injection attempts
  - id: log4shell
    description: JNDI lookup probes arrive in URL-shaped headers as often as in the URI
    action: block
    targets: [ query, ua, "header:referer", "header:x-forwarded-for" ]
    keywords: [ "${jndi:" ]

  # Shellshock (CVE-2014-6271)
  - id: shellshock
    description: Bash environment function injection targeting CGI and environment variables
    action: block
    targets: [ query, ua, "header:referer" ]
    keywords: [ "() { :; };" ]

  # Unused HTTP Methods
  - id: trace-method
    description: TRACE/TRACK have no legitimate use on a production site
    action: deny
    methods: [ TRACE, TRACK ]

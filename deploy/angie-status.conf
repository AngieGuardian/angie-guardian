# Angie status API for the Guardian dashboard (optional).
#
# The Guardian dashboard can show what Guardian never sees on its stateless
# allow path — per-domain request counts and rates, live connections,
# response-code mix, bandwidth, upstream peer health, proxy-cache hit rates,
# Angie's own rate-limit zones and shared-memory pressure — by reading Angie's
# own HTTP API. This file enables that API and the counters that feed it.
#
# SECURITY: keep the API on loopback. guardiand reads it server-side and relays
# it to the dashboard behind the admin token, so the API itself never needs to
# be exposed. Do NOT put this listener on a public interface.
#
# After enabling this, point guardiand at it:
#
#   admin:
#     angie_api:
#       url: http://127.0.0.1:81/status/
#       # timeout: 2s
#
# ---------------------------------------------------------------------------

# 1) Per-zone counters. Add a `status_zone` to each protected server {} block so
#    its traffic is counted separately. Grouping by $host gives one zone per
#    virtual host in a single server block:
#
#       server {
#           server_name example.com;
#           status_zone example.com;      # or:  status_zone $host;
#           ...
#       }
#
#    Add `status_zone` inside `location` blocks too for per-path counters
#    (these appear under location_zones in the API).

# 1b) Optional, each unlocking one more dashboard panel. Anything you do not
#     configure simply stays hidden; none of this needs Angie PRO.
#
#     Upstream peer health (state, failures, downtime, latency) needs the
#     upstream to live in shared memory:
#
#       upstream backend {
#           zone backend 64k;
#           server 10.0.0.2:8080;
#       }
#
#     Proxy-cache hit rates come from any proxy_cache_path you already have
#     (its keys_zone), and rate-limit counters from your limit_req_zone /
#     limit_conn_zone definitions. Shared-memory (slab) usage is always
#     reported: watch the allocation-failure column, it means a zone is sized
#     too small.

# 2) The API endpoint itself, on a loopback-only listener. Put this in the
#    http {} context.
server {
    listen 127.0.0.1:81;

    # The whole listener is loopback; this is defence in depth.
    allow 127.0.0.0/8;
    allow ::1/128;
    deny all;

    location /status/ {
        api /status/;
        # api_config_files on;   # optionally expose config; not needed here
    }
}

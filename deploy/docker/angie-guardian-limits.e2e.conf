# Angie Guardian control-plane admission for the E2E test harness.
#
# Enables baseline admission rate limiting for baseline.localhost (so
# TestGuardianBaselineControlPlaneAdmission tests baseline shedding), while
# leaving normal test hosts unthrottled during rapid sequential/concurrent test
# execution from the single test runner IP.

map $host $guardian_challenge_ip_key {
    default "";
    baseline.localhost "$host$binary_remote_addr";
}
map $host $guardian_pass_ip_key {
    default "";
    baseline.localhost "$host$binary_remote_addr";
}
map $host $guardian_assets_ip_key {
    default "";
    baseline.localhost "$host$binary_remote_addr";
}

limit_req_zone $guardian_challenge_ip_key zone=guardian_challenge_ip:10m rate=30r/m;
limit_req_zone $guardian_pass_ip_key zone=guardian_pass_ip:10m rate=30r/m;
limit_req_zone $guardian_assets_ip_key zone=guardian_assets_ip:10m rate=20r/s;

# One sidecar-wide concurrent-work ceiling.
map $host $guardian_control_plane_key {
    default guardian;
}
limit_conn_zone $guardian_control_plane_key zone=guardian_control_plane:1m;

# Angie config for the nftables-offload harness. Identical to
# angie.docker.conf except that guardiand SHARES this container's network
# namespace (compose.nft.yaml runs it with network_mode: "service:angie"), so
# the sidecar is reached at 127.0.0.1:8071 rather than over the compose bridge,
# and guardiand's admin listener (127.0.0.1:8072) is proxied through here so
# the e2e harness and curl can reach /admin and /metrics.
worker_processes auto;
error_log /dev/stderr info;
pid /run/angie.pid;

events {}

http {
    access_log /dev/stdout;

    # guardiand shares this namespace: reach it on loopback, not "guardiand:".
    upstream guardian {
        server 127.0.0.1:8071;
        keepalive 64;
    }

    upstream guardian_admin {
        server 127.0.0.1:8072;
        keepalive 8;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80 default_server;
        server_name _;

        location = /__guardian/auth {
            internal;
            proxy_pass              http://guardian/auth;
            proxy_http_version      1.1;
            proxy_set_header        Connection        "";
            proxy_pass_request_body off;
            proxy_set_header        Content-Length    "";
            proxy_set_header        X-Guardian-Host   $host;
            proxy_set_header        X-Guardian-Method $request_method;
            proxy_set_header        X-Guardian-URI    $request_uri;
            proxy_set_header        X-Guardian-IP     $remote_addr;
            proxy_set_header        X-Guardian-UA     $http_user_agent;
            proxy_set_header        X-Guardian-Cookie $http_cookie;
            proxy_connect_timeout   2s;
            proxy_read_timeout      2s;
        }

        location / {
            auth_request /__guardian/auth;
            auth_request_set $guardian_action $upstream_http_x_guardian_action;
            auth_request_set $guardian_reason $upstream_http_x_guardian_reason;
            auth_request_set $guardian_difficulty $upstream_http_x_guardian_difficulty;

            error_page 401 = @guardian_challenge;
            error_page 403 = @guardian_denied;
            error_page 500 = @guardian_bypass;

            proxy_pass http://backend;
        }

        location @guardian_challenge {
            rewrite ^ /challenge break;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://guardian;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Guardian-Host       $host;
            proxy_set_header X-Guardian-IP         $remote_addr;
            proxy_set_header X-Guardian-URI        $request_uri;
            proxy_set_header X-Guardian-UA         $http_user_agent;
            proxy_set_header X-Guardian-Difficulty $guardian_difficulty;
        }

        location = /__guardian/pass {
            proxy_pass http://guardian/pass$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Guardian-Host  $host;
            proxy_set_header X-Guardian-IP    $remote_addr;
            proxy_set_header X-Guardian-UA    $http_user_agent;
            proxy_set_header X-Guardian-Proto $scheme;
        }

        location @guardian_denied {
            if ($guardian_action = shed) {
                add_header Retry-After 2 always;
                return 503;
            }
            rewrite ^ /denied break;
            proxy_pass http://guardian;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location @guardian_bypass {
            proxy_pass http://backend;
        }
    }

    # Admin API + metrics, published on :8072 so the harness can drive blocks
    # and read /admin/offload. In production the admin listener stays private;
    # this is a test convenience only.
    server {
        listen 8072;
        server_name _;
        location / {
            proxy_pass http://guardian_admin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

# Angie config for the Docker harness: a full reverse proxy wiring Guardian in
# via auth_request, fronting the whoami backend. Self-contained (top-level
# angie.conf, not an include) so it can be mounted directly.
worker_processes auto;
error_log /dev/stderr info;
pid /run/angie.pid;

events {}

http {
    access_log /dev/stdout;

    # Guardian sidecar upstream with keepalive — required for throughput.
    upstream guardian {
        server guardiand:8071;
        keepalive 64;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80 default_server;
        server_name _;

        # --- internal auth subrequest to Guardian ---
        location = /__guardian/auth {
            internal;
            proxy_pass              http://guardian/auth;
            proxy_http_version      1.1;
            proxy_set_header        Connection        "";
            proxy_pass_request_body off;
            proxy_set_header        Content-Length    "";
            proxy_set_header        X-Guardian-Host   $host;
            proxy_set_header        X-Guardian-Method $request_method;
            proxy_set_header        X-Guardian-URI    $request_uri;
            proxy_set_header        X-Guardian-IP     $remote_addr;
            proxy_set_header        X-Guardian-UA     $http_user_agent;
            proxy_set_header        X-Guardian-Cookie $http_cookie;
            proxy_connect_timeout   2s;
            proxy_read_timeout      2s;
        }

        location / {
            auth_request /__guardian/auth;
            auth_request_set $guardian_action $upstream_http_x_guardian_action;
            auth_request_set $guardian_reason $upstream_http_x_guardian_reason;
            auth_request_set $guardian_difficulty $upstream_http_x_guardian_difficulty;

            error_page 401 = @guardian_challenge;
            error_page 403 = @guardian_denied;

            # FAIL MODE toggle — the harness ships fail-OPEN (the documented
            # default) so a stopped guardiand still serves the backend. Comment
            # this line out to reproduce the fail-CLOSED behavior.
            error_page 500 = @guardian_bypass;

            proxy_pass http://backend;
        }

        location @guardian_challenge {
            # A named location cannot carry a URI part on proxy_pass, so rewrite
            # the path first and proxy to the upstream without one. The original
            # request may be non-GET; never relay its method or body to Guardian.
            rewrite ^ /challenge break;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_pass http://guardian;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Guardian-Host       $host;
            proxy_set_header X-Guardian-IP         $remote_addr;
            proxy_set_header X-Guardian-URI        $request_uri;
            proxy_set_header X-Guardian-UA         $http_user_agent;
            proxy_set_header X-Guardian-Difficulty $guardian_difficulty;
        }

        location = /__guardian/pass {
            proxy_pass http://guardian/pass$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Guardian-Host  $host;
            proxy_set_header X-Guardian-IP    $remote_addr;
            proxy_set_header X-Guardian-UA    $http_user_agent;
            proxy_set_header X-Guardian-Proto $scheme;
        }

        location @guardian_denied {
            # Load-shed: sidecar returns 403 + X-Guardian-Action: shed under
            # saturation; turn it into a real 503 + Retry-After.
            if ($guardian_action = shed) {
                add_header Retry-After 2 always;
                return 503;
            }
            rewrite ^ /denied break;
            proxy_pass http://guardian;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location @guardian_bypass {
            proxy_pass http://backend;
        }
    }
}

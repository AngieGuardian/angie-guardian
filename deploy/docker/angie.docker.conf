# Angie config for the Docker harness: a full reverse proxy wiring Guardian in
# via auth_request, fronting the whoami backend. Self-contained (top-level
# angie.conf, not an include) so it can be mounted directly.
worker_processes auto;
error_log /dev/stderr info;
pid /run/angie.pid;

events {}

http {
    access_log /dev/stdout;

    # E2E harness test-only application admission zone. Models an operator-selected
    # protected-content budget; the shipped Guardian baseline is included below
    # and protects only known control-plane paths.
    map $host $guardian_e2e_test_key {
        default "";
        admission.localhost $binary_remote_addr;
    }
    map $host $guardian_e2e_test_conn_key {
        default "";
        admission.localhost $binary_remote_addr;
    }
    # High limits for e2e test floods: rate=10r/s with burst=100 lets tests
    # send 80 concurrent requests and verify shedding without waiting for rate limits.
    limit_req_zone  $guardian_e2e_test_key zone=guardian_e2e_test_req:10m rate=10r/s;
    limit_conn_zone $guardian_e2e_test_conn_key zone=guardian_e2e_test_conn:10m;

    include angie-guardian-limits.conf;

    # Guardian sidecar upstream with keepalive — required for throughput.
    upstream guardian {
        server guardiand:8071;
        keepalive 64;
    }

    upstream backend {
        # A shared-memory zone makes this upstream's peers visible in the API,
        # which is what feeds the dashboard's Upstreams panel.
        zone backend 64k;
        server backend:8080;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Traffic counters for the Guardian dashboard's Angie API panel.
        status_zone site;

        # The empty map key disables this E2E harness test limit for normal
        # harness hosts. admission.localhost receives a deliberately tiny
        # application budget.
        limit_req zone=guardian_e2e_test_req burst=1 nodelay;
        limit_conn guardian_e2e_test_conn 1;
        limit_req_status 429;
        limit_conn_status 429;

        # Exercise the exact reusable server glue shipped to operators.
        include angie-guardian.conf;
        include angie-guardian-location.conf;

        location / {
            status_zone root;   # per-location counter (appears in location_zones)
            proxy_pass http://backend;
        }

        # A vhost that puts Basic auth in front of Guardian. auth_basic runs
        # before auth_request and short-circuits, so Guardian never evaluates a
        # credential-less request and its 401 is Angie's own. The server-level
        # `error_page 401` above sends every 401 to @guardian_challenge, so
        # without the guard there this location answers 200 plus the
        # interstitial and the browser never prompts. Covered by
        # TestAngieOwn401IsNotAnsweredWithTheInterstitial.
        location /basic/ {
            auth_basic "restricted";
            auth_basic_user_file /etc/angie/basic.htpasswd;
            proxy_pass http://backend;
        }
    }

    # Angie HTTP API on a separate port for the Guardian dashboard. Reachable
    # only over the compose network (guardiand -> angie:81); not published.
    server {
        listen 81;
        location /status/ {
            api /status/;
        }
    }
}

# Angie Guardian — semi-production test harness.
#
#   Angie (reverse proxy, auth_request) ──► guardiand (sidecar) ──► whoami backend
#
# Brings up the full Path A topology so the auth flow, PoW challenge, fail
# modes, and header trust can be exercised end to end without touching a real
# site. Run from this directory:
#
#   docker compose up --build -d
#   ../docker/smoke.sh          # end-to-end assertions
#   docker compose down -v
#
# Networking note: guardiand's port is deliberately NOT published to the host
# (no `ports:`). It is reachable only on the internal compose network, mirroring
# production where the sidecar must not be directly reachable. The `guardian-exposed`
# profile (see bottom) opts into publishing it, to reproduce the direct-reach
# header-spoofing finding.
name: angie-guardian-harness

services:
  guardiand:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["-config", "/etc/guardian/guardian.yaml"]
    volumes:
      - ./guardian.docker.yaml:/etc/guardian/guardian.yaml:ro
      - ./rules-common.yaml:/etc/guardian/rules.d/common.yaml:ro
      - guardian-data:/var/lib/guardian
      - guardian-keys:/etc/guardian/keys
    # Hot path (8071) is internal only — Angie reaches it as http://guardiand:8071.
    # Admin/metrics (8072) is published to host loopback so smoke.sh and manual
    # curl can reach the admin API and /metrics.
    expose:
      - "8071"
    ports:
      - "127.0.0.1:8072:8072"
    healthcheck:
      # The distroless image has no shell; guardiand serves /healthz on both
      # listeners. Angie depends on this being healthy before it starts.
      test: ["CMD", "/usr/local/bin/guardiand", "-version"]
      interval: 5s
      timeout: 2s
      retries: 5

  backend:
    # Stand-in origin: echoes request details so we can confirm a request
    # actually reached the backend (i.e. Guardian allowed it).
    image: traefik/whoami:latest
    command: ["--port", "8080"]
    expose:
      - "8080"

  angie:
    image: docker.angie.software/angie:latest
    depends_on:
      guardiand:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./angie.docker.conf:/etc/angie/angie.conf:ro
    ports:
      - "127.0.0.1:8080:80"   # the protected site, on the host loopback

volumes:
  guardian-data:
  guardian-keys:

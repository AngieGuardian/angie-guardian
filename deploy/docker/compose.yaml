# Angie Guardian — semi-production test harness.
#
#   Angie (reverse proxy, auth_request) ──► guardiand (sidecar) ──► whoami backend
#
# Brings up the full Path A topology so the auth flow, PoW challenge, fail
# modes, and header trust can be exercised end to end without touching a real
# site. The automated e2e suite (test/e2e/, `make e2e`) boots this same file
# via testcontainers-go; to drive it by hand instead, run from this directory:
#
#   docker compose up --build -d
#   docker compose down -v
#
# Networking note: guardiand's port is deliberately NOT published to the host
# (no `ports:`). It is reachable only on the internal compose network, mirroring
# production where the sidecar must not be directly reachable. To debug it
# manually, temporarily add a loopback-only port mapping yourself.
name: angie-guardian-harness

services:
  guardiand:
    # The harness builds from the working tree on purpose: the e2e suite must
    # test YOUR code, not a release. For a real deployment use the prebuilt
    # image instead (see the production guide):
    #   image: registry.melroy.org/melroy/angie-guardian:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    command: ["-config", "/etc/guardian/guardian.yaml"]
    volumes:
      # Manual demo harness config by default (realistic PoW difficulty). The
      # automated e2e suite selects the faster guardian.e2e.yaml via
      # GUARDIAN_CONFIG (see test/e2e/harness_test.go).
      - ${GUARDIAN_CONFIG:-./guardian.docker.yaml}:/etc/guardian/guardian.yaml:ro
      - ./rules-common.yaml:/etc/guardian/rules.d/common.yaml:ro
      - guardian-data:/var/lib/guardian
      - guardian-keys:/etc/guardian/keys
    # Hot path (8071) is internal only — Angie reaches it as http://guardiand:8071.
    # Admin/metrics (8072) is published to host loopback so the e2e suite and
    # manual curl can reach the admin API and /metrics. The host port is
    # overridable via GUARDIAN_ADMIN_PORT so the Go e2e harness can pick a free
    # port and never collide with whatever else is running on the box.
    expose:
      - "8071"
    ports:
      - "127.0.0.1:${GUARDIAN_ADMIN_PORT:-8072}:8072"
      # The auth hot path is published on a host-chosen ephemeral port by
      # default (GUARDIAN_AUTH_PORT overrides it). The attack-mode e2e test
      # reads the mapping back and drives /challenge directly from many
      # synthetic X-Guardian-IP values; the e2e config runs trusted_proxy: true.
      # Manual/production topologies keep the sidecar internal to Angie.
      - "127.0.0.1:${GUARDIAN_AUTH_PORT:-0}:8071"
    healthcheck:
      # The distroless image has no shell; guardiand serves /healthz on both
      # listeners. Angie depends on this being healthy before it starts.
      # Liveness only, on purpose: it must not follow the store, or a store
      # outage would restart-loop a container that is still (fail-open)
      # serving. Readiness is GET /readyz on the admin listener.
      test: ["CMD", "/usr/local/bin/guardiand", "-config", "/etc/guardian/guardian.yaml", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    # Stand-in origin: echoes request details so we can confirm a request
    # actually reached the backend (i.e. Guardian allowed it).
    image: traefik/whoami:latest
    command: ["--port", "8080"]
    expose:
      - "8080"

  angie:
    image: docker.angie.software/angie:latest
    depends_on:
      guardiand:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ./angie.docker.conf:/etc/angie/angie.conf:ro
    ports:
      # The protected site, on the host loopback. Host port overridable via
      # GUARDIAN_SITE_PORT so the e2e harness can pick a free port.
      - "127.0.0.1:${GUARDIAN_SITE_PORT:-8080}:80"

volumes:
  guardian-data:
  guardian-keys:

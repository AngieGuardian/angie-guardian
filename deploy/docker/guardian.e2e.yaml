# Guardian config for the AUTOMATED e2e suite (test/e2e, `make e2e`).
#
# Identical to guardian.docker.yaml (the manual demo harness) except for the
# PoW difficulty: the suite brute-forces challenges in Go on every run, so it
# runs one step below the production default to stay fast, and the WAF
# escalation test asserts base 16 bits + 4 = 20. If you change anything
# structural here (hosts, thresholds, token), keep guardian.docker.yaml in
# sync and vice versa; the e2e assertions depend on these exact values.
#
# The compose file mounts guardian.docker.yaml by default; the e2e harness
# selects this file via the GUARDIAN_CONFIG env var (see compose.yaml).
listen: 0.0.0.0:8071
# The hot path binds 0.0.0.0 so Angie (a separate container) can reach it, but
# the port is NOT published to the host (see compose.yaml), so it stays
# isolated to the compose network. trusted_proxy acknowledges that isolation;
# without it guardiand refuses a non-loopback bind.
trusted_proxy: true
log_level: info

admin:
  listen: 0.0.0.0:8072
  token: "harness-admin-token"   # harness only; use ADMIN_TOKEN env in real deploys
                                  # (0.0.0.0 admin bind without a token is refused)
  dashboard: true                 # the reporting page at /admin/dashboard
  angie_api:                      # dashboard reads Angie's own traffic counters
    url: http://angie:81/status/  # the api listener in angie.docker.conf
    timeout: 3s

signing_key_file: /etc/guardian/keys/ed25519.key
previous_key_dir: /etc/guardian/keys/keys.d

store:
  backend: pebble
  path: /var/lib/guardian/pebble

# Attack mode with a short window and thresholds low enough for the e2e
# attack-mode test to trip by hammering /challenge, but well above what the
# other tests generate. request_rate stays disabled so ordinary suite traffic
# never elevates.
attack_mode:
  enabled: true
  window: 10s
  min_dwell: 10s
  share_posture: false
  signals:
    challenge_rate: 15/s
    attack_challenge_rate: 30/s
    min_solve_ratio: 0.2
  effects:
    # This is a PARTIAL effects block, so omitted raises stay at their zero
    # value (no default is applied). The attack-mode e2e test asserts a +4-bit
    # raise, so set it explicitly.
    attack_difficulty_raise: 1.0
    # Low enough that a concurrent burst in the shed e2e test saturates it,
    # high enough that the sequential tests never hit it.
    max_inflight: 4

defaults:
  waf:
    ip_behaviour:
      enabled: true
      block_ttl: 15m
      max_block_ttl: 4h
      thresholds:
        rule_match: 10/min
        pow_fail: 10/min
        tamper: 10/min
        bot_spoof: 5/min
    rules:
      enabled: true
      files: [ /etc/guardian/rules.d/common.yaml ]
    honeypot:
      enabled: false
      paths: []
  pow:
    enabled: true
    mode: always
    # Deliberately below the production default (5): the e2e suite solves
    # challenges in Go on every run, and the WAF escalation test asserts
    # base 16 bits + 4 = 20. Raising this slows every e2e run.
    base_difficulty: 4
    max_difficulty: 6
    token_ttl: 7d
    challenge_ttl: 30m         # must be positive; 24h maximum
    # Generous so the attack-mode test can hammer /challenge from a handful of
    # rotating IPs without hitting the per-IP cap before the global rate trips.
    issuance_rate_limit: 6000/min
    # On for TestNoJSMetaRefreshFallback; production default is off (the 5s
    # no-JS wait is weaker than PoW, see guardian.example.yaml).
    noscript_fallback: true
  allowlist:
    # Empty like production: allowlisted ips/paths skip the entire pipeline.
    ips: []
    # No crawler names in uas: a UA string is forgeable. See verified_bots.
    uas: []
    paths:
      # robots.txt stays a terminal allowlist entry here (unlike the
      # production example, which exempts it with a defaults.paths pow
      # overlay): the compose healthcheck and several tests fetch it before
      # any challenge flow, and the block tests expect it to stay reachable.
      - /robots.txt
      - /favicon.ico
      - /.well-known/acme-challenge/
  denylist:
    ips: []
  # Fleet-wide per-path overlay: inherited by every host below and by unknown
  # hosts, merged over each host's own settings. Unlike the allowlist entries
  # above it is not terminal: only PoW is off here, the WAF still inspects the
  # request. TestDefaultsPathOverlay asserts both halves.
  paths:
    "/public-feed.xml":
      pow: { enabled: false }
  # verified_bots is granted per domain (below) like production, never in
  # defaults: a confirmed crawler identity is a terminal allow.

domains:
  admission.localhost:
    pow: { enabled: false }
  baseline.localhost: {}
  # The harness site. PoW on so we can exercise the challenge flow, with a
  # per-path overlay disabling PoW under /api/ (the WAF stays active there).
  localhost:
    pow: { enabled: true }
    # Kept in sync with guardian.docker.yaml. Inert in the e2e suite: no test
    # claims a crawler UA, and the compose network has no real crawler rDNS.
    verified_bots:
      bots:
        - name: googlebot
        - name: bingbot
    paths:
      "/api/":
        pow: { enabled: false }
      # Header-shape PoW exemption under a path that otherwise keeps PoW on.
      # The arbitrary header/scheme proves the matcher is configuration-driven.
      "/machine-api/":
        pow:
          header_exemptions:
            - { header: X-E2E-Machine-Proof, prefix: "Harness ", require_value: true, max_length: 64 }
      # The documented rollback for the unchallengeable-request refusal, scoped
      # to one path so the rest of the host keeps refusing. Exists because the
      # rollback is the case where the two Angie hops could disagree: the auth
      # subrequest records the decision and the challenge handler serves it, so
      # a switch either of them could read differently would report a withheld
      # challenge while handing the client a real one.
      "/rollback-refusal":
        pow: { refuse_unchallengeable: false }
  # Memory-hard browser solver and server verifier path. Kept at the minimum
  # supported 8 MiB for suite speed; production defaults to 32 MiB.
  argon.localhost:
    pow:
      enabled: true
      algorithm: argon2id
      argon2id: { memory_kib: 8192, base_iterations: 1, max_iterations: 1, attack_iterations_cap: 1 }
  # A WAF-only host to test the no-PoW path.
  api.localhost:
    pow: { enabled: false }
  # A WAF-only API policy that extends the common rules for multi-file tests.
  rules.localhost:
    pow: { enabled: false }
    waf:
      rules:
        # Appends after common.yaml: baseline probes still win before these
        # API-specific allow/fallback rules.
        files: [ /etc/guardian/rules.d/api.yaml ]
  # challenge_farm blocking test host: base == max pins the unsolved-
  # challenge escalation at the ceiling from its first extra bit (the 6th
  # abandoned issuance), and the low threshold override blocks quickly
  # (the built-in default is a generous 80/h). Escalation counters are per
  # host+IP, so farming here never escalates the other hosts.
  farm.localhost:
    pow: { enabled: true, base_difficulty: 4, max_difficulty: 4 }
    waf:
      ip_behaviour:
        thresholds: { challenge_farm: 3/min }
  # A WordPress-ish host: shares the common rules file but disables its
  # wp-cms-probe rule by exact id (issue #27); every other rule still applies.
  wp.localhost:
    pow: { enabled: false }
    waf:
      rules:
        disabled_ids: [ wp-cms-probe ]

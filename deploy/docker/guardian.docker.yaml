# Guardian config for the MANUAL Docker demo harness (`docker compose up`).
# Mirrors guardian.example.yaml but with container paths and listeners bound
# to 0.0.0.0 so Angie (a different container) can reach the sidecar over the
# compose network.
#
# The automated e2e suite uses guardian.e2e.yaml instead (selected via the
# GUARDIAN_CONFIG env var, see compose.yaml): same file except for a lower PoW
# difficulty so the suite stays fast. Keep the two structurally in sync.
#
# NOTE: binding the hot path to 0.0.0.0 is exactly the "direct-reach" exposure
# the security review flagged — safe here only because the port is NOT
# published to the host (see compose.yaml). In production keep it on loopback
# or an isolated network.
listen: 0.0.0.0:8071
# The hot path binds 0.0.0.0 so Angie (a separate container) can reach it, but
# the port is NOT published to the host (see compose.yaml), so it stays
# isolated to the compose network. trusted_proxy acknowledges that isolation;
# without it guardiand refuses a non-loopback bind.
trusted_proxy: true
log_level: info

admin:
  listen: 0.0.0.0:8072
  token: "harness-admin-token"   # harness only; use ADMIN_TOKEN env in real deploys
                                  # (0.0.0.0 admin bind without a token is refused)
  dashboard: true                 # the reporting page at /admin/dashboard

signing_key_file: /etc/guardian/keys/ed25519.key
previous_key_dir: /etc/guardian/keys/keys.d

store:
  backend: bbolt
  path: /var/lib/guardian/guardian.db

# GeoIP scoping + reputation feeds (see guardian.example.yaml). Off in the
# harness: the fixture databases/feeds would have to be mounted into the
# container first.
# geoip:
#   country_db: /var/lib/GeoIP/GeoLite2-Country.mmdb
#   asn_db: /var/lib/GeoIP/GeoLite2-ASN.mmdb
# reputation:
#   cache_dir: /var/lib/guardian/feeds
#   feeds:
#     - name: firehol-level1
#       url: https://iplists.firehol.org/files/firehol_level1.netset

defaults:
  waf:
    ip_behaviour:
      enabled: true
      block_ttl: 15m          # maximum 8760h
      max_block_ttl: 4h       # maximum 8760h
      thresholds:
        signature: 10/min
        pow_fail: 10/min
        tamper: 10/min
        bot_spoof: 5/min
    keywords:
      enabled: true
      rules_file: /etc/guardian/rules.d/common.yaml
    honeypot:
      enabled: false
      paths: []
  pow:
    enabled: true
    mode: always
    # One quarter-step above the production default (5) so the interstitial
    # is actually perceptible on a fast desktop when demoing (about half a
    # second; 5 solves in ~0.1s there). The e2e suite uses guardian.e2e.yaml
    # with a lower value instead.
    base_difficulty: 5.5
    max_difficulty: 6
    token_ttl: 4h             # 1s minimum, 7d maximum
    challenge_ttl: 30m
    noscript_fallback: true
  allowlist:
    ips: [ "127.0.0.1", "::1" ]
    # No crawler names in uas: a UA string is forgeable. See verified_bots.
    uas: []
    paths:
      - /robots.txt
      - /favicon.ico
      - /.well-known/
  denylist:
    ips: []
  # Crawlers allowlisted by reverse-DNS + forward-confirmed identity, never by
  # their forgeable User-Agent string. See guardian.example.yaml and USAGE.md.
  verified_bots:
    bots:
      - name: googlebot
      - name: bingbot

domains:
  # The harness site. PoW on so we can exercise the challenge flow.
  localhost:
    pow: { enabled: true }
  # A WAF-only host to test the no-PoW path.
  api.localhost:
    pow: { enabled: false }

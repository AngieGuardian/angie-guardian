# Angie Guardian — handler-neutral protection directives (Path A).
#
# Normally include this once at server {} scope, beside angie-guardian.conf, so
# every content location in that vhost inherits protection:
#
#   include /etc/angie/angie-guardian.conf;
#   include /etc/angie/angie-guardian-location.conf;
#
# Put `auth_request off;` in deliberate exceptions. In particular, when a
# protected public location uses try_files to enter an `internal` FastCGI front
# controller, put `auth_request off;` in that internal target: the request was
# already authorized before the redirect, so this avoids a second subrequest.
# The `internal` directive prevents an external client using it as a bypass.
#
# For selective protection instead, include this file only inside each public
# content location that should use Guardian.
#
# The companion angie-guardian.conf must be included once in the same server {}
# to provide /__guardian/auth and the challenge/pass/denied named locations.

auth_request /__guardian/auth;
auth_request_set $guardian_action $upstream_http_x_guardian_action;
auth_request_set $guardian_reason $upstream_http_x_guardian_reason;

# The difficulty the decision asked for (in leading-zero bits). Relayed to the
# challenge page so a WAF/anomaly-escalated challenge is actually issued harder
# than the base difficulty.
auth_request_set $guardian_difficulty $upstream_http_x_guardian_difficulty;

# Whether that 401 is a real challenge or a refusal, and if a refusal, which
# kind. Relayed for the same reason as the difficulty: the challenge hop is a
# second subrequest, so anything it works out for itself can disagree with what
# was already recorded here. A config reload landing between the two hops is
# enough to do it. Guardian falls back to deciding at the challenge hop when
# this is absent, so an older config keeps working exactly as it did.
auth_request_set $guardian_refusal $upstream_http_x_guardian_refusal;

error_page 401 = @guardian_challenge;
error_page 403 = @guardian_denied;

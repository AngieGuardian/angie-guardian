# Optional Angie server-hardening profile for the http {} context.
# Defines shared state used by the companion server-scope profile. Include this
# file once inside http {}:
#   include /etc/angie/angie-hardening-http.conf;

# Bound active client-facing requests by source address and across each vhost.
# Angie counts HTTP/2 and HTTP/3 requests independently once their complete
# request headers have been received.
limit_conn_zone $binary_remote_addr zone=angie_hardening_client:10m;
limit_conn_zone $server_name        zone=angie_hardening_server:1m;

# Reuse TLS sessions without allowing the cache to grow without a fixed bound.
ssl_session_cache shared:angie_hardening_tls_sessions:10m;
ssl_session_timeout 10m;

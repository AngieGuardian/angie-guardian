# Angie Guardian: optional WASM integration (stateless WAF).
#
# This runs Guardian's stateless WAF checks (allowlist, denylist, honeypot,
# keyword/regex signatures) IN-PROCESS inside Angie via its WebAssembly
# support, as an alternative to the auth_request sidecar. It does NOT do
# proof-of-work, behavioural IP blocking, or anomaly scoring: those need the
# shared store and are sidecar-only (see deploy/angie-guardian.conf).
#
# Build the module first:
#   make wasm      # -> guardian.wasm
#   # or: GOOS=wasip1 GOARCH=wasm go build -o guardian.wasm ./transport/wasm
#
# Requires an Angie build with WASM support (wasmtime or WAMR runtime).

# --- http {} context --------------------------------------------------------
# Load the module once. The config= value is the guest configuration blob
# (YAML or JSON), delivered to the guest via the http-wasm get_config call.
# Keep it inline as below, or point at a file with config_file= if your Angie
# build supports it.
wasm_modules {
    load /etc/guardian/guardian.wasm id=guardian type=reactor
      config='
        defaults:
          denylist: { ips: [] }
        domains:
          example.com:
            allowlist:
              ips: [ "10.0.0.0/8" ]
              uas: [ "Googlebot", "bingbot" ]
              paths: [ "/robots.txt", "/.well-known/" ]
            honeypot:
              enabled: true
              paths: [ "/wp-login.php", "/xmlrpc.php" ]
            rules:
              - id: dotfile-probe
                action: deny
                keywords: [ "/.env", "/.git/", "/.aws/" ]
              - id: path-traversal
                action: deny
                keywords: [ "../", "%2e%2e/" ]
              - id: scanner-ua
                action: deny
                targets: [ ua ]
                keywords: [ "sqlmap", "nikto", "nuclei" ]
      ';
}

# --- server {} / location {} context ---------------------------------------
# Invoke the guest as the content handler. It returns "allow" to continue to
# your backend, or sets a 403 response and stops. Put it in front of your
# normal content handling.
#
# server {
#     server_name example.com;
#
#     location / {
#         wasm_content handler "ngx:wasi/http-handler-entry#handle-request" module=guardian;
#         # ... your normal proxy_pass / root handling continues when allowed ...
#     }
# }

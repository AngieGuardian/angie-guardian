# Angie Guardian — glue for one protected server {} block (Path A).
#
# Guardian is wired in with stock Angie directives: every request triggers a
# fast internal auth_request subrequest to the Guardian sidecar, which answers
#   2xx  -> allow (request continues to your backend)
#   401  -> divert to @guardian_challenge (PoW interstitial)
#   403  -> divert to @guardian_denied
#
# Copy this into each server {} block you want protected (or `include` it and
# add the `location /` directives to your own root location).
#
# REQUIRED, once in the http {} context (not per server): an upstream with
# keepalive. Without it every auth subrequest opens a fresh TCP connection to
# the sidecar, which becomes the bottleneck long before Guardian does at high
# request rates.
#
#   upstream guardian {
#       server 127.0.0.1:8071;
#       keepalive 64;
#   }

# --- internal subrequest target -------------------------------------------
location = /__guardian/auth {
    internal;
    proxy_pass              http://guardian/auth;
    proxy_http_version      1.1;
    proxy_set_header        Connection        "";
    proxy_pass_request_body off;
    proxy_set_header        Content-Length    "";
    proxy_set_header        X-Guardian-Host   $host;
    proxy_set_header        X-Guardian-Method $request_method;
    proxy_set_header        X-Guardian-URI    $request_uri;
    proxy_set_header        X-Guardian-IP     $remote_addr;
    proxy_set_header        X-Guardian-UA     $http_user_agent;
    proxy_set_header        X-Guardian-Cookie $http_cookie;

    # Keep the auth hop snappy; see "fail mode" below for what happens on timeout.
    proxy_connect_timeout   2s;
    proxy_read_timeout      2s;
}

# --- protected content ------------------------------------------------------
location / {
    auth_request /__guardian/auth;
    auth_request_set $guardian_action $upstream_http_x_guardian_action;
    auth_request_set $guardian_reason $upstream_http_x_guardian_reason;
    # The difficulty the decision asked for (in leading-zero bits). Relayed to
    # the challenge page below so a WAF/anomaly-escalated challenge is actually
    # issued harder than the base difficulty.
    auth_request_set $guardian_difficulty $upstream_http_x_guardian_difficulty;

    error_page 401 = @guardian_challenge;
    error_page 403 = @guardian_denied;

    # FAIL MODE — what happens when the Guardian sidecar is down:
    # auth_request turns sidecar errors into a 500. Guardian's chosen default is
    # fail-OPEN (availability first): the line below routes auth errors to the
    # backend so a sidecar outage does not take the site down. Backend-origin
    # 500s are NOT affected (proxy_intercept_errors is off). To fail CLOSED
    # instead (block all traffic when Guardian is unreachable), comment it out.
    error_page 500 = @guardian_bypass;

    proxy_pass http://your_backend;
}

# --- Guardian-served pages ---------------------------------------------------
location @guardian_challenge {           # PoW interstitial (self-contained HTML)
    # A named location cannot carry a URI part on proxy_pass, so set the
    # upstream path with rewrite first, then proxy without one.
    rewrite ^ /challenge break;
    proxy_pass http://guardian;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Guardian-Host       $host;
    proxy_set_header X-Guardian-IP         $remote_addr;
    proxy_set_header X-Guardian-URI        $request_uri;
    proxy_set_header X-Guardian-UA         $http_user_agent;
    proxy_set_header X-Guardian-Difficulty $guardian_difficulty;
}

location = /__guardian/pass {            # PoW solution submission (JS + no-JS)
    proxy_pass http://guardian/pass$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Guardian-Host  $host;
    proxy_set_header X-Guardian-IP    $remote_addr;
    proxy_set_header X-Guardian-UA    $http_user_agent;
    # $scheme tells Guardian whether the token cookie may carry the Secure
    # flag: over plain http a Secure cookie would never come back and the
    # client would loop on the challenge forever.
    proxy_set_header X-Guardian-Proto $scheme;
}

location @guardian_denied {
    rewrite ^ /denied break;
    proxy_pass http://guardian;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

# Fail-open passthrough: identical to `location /` minus auth_request.
location @guardian_bypass {
    proxy_pass http://your_backend;
}

# Angie Guardian sidecar integration for Angie. Include this file in every
# protected server {} block. It defines only Angie Guardian's internal auth/challenge/denied
# endpoints; it does NOT define your site's content handler. Your existing
# root/try_files, fastcgi_pass, proxy_pass, static files, WebSocket settings, etc.
# stay intact. Feel free to modify if you know what you're doing.

# Angie Guardian uses stock Angie directives. A protected request makes
# a fast internal auth_request subrequest to the Angie Guardian sidecar, which answers
#   2xx  -> allow (request continues in the site's existing content handler)
#   401  -> divert to @guardian_challenge (PoW interstitial)
#   403  -> divert to @guardian_denied
#
# REQUIRED, once in the http {} context (not per server): an upstream with
# keepalive. Without it every auth subrequest opens a fresh TCP connection to
# the sidecar, which becomes the bottleneck long before Guardian does at high
# request rates. Also required: include the companion angie-guardian-limits.conf, which defines the shared
# concurrency limit and the per-path request-rate limits for the public control plane. Example:
#
#   include angie-guardian-limits.conf;
#
#   upstream guardian {
#       server 127.0.0.1:8071;
#       keepalive 64;
#   }
#
# If Angie is behind another proxy/CDN, configure trusted set_real_ip_from +
# real_ip_header (or PROXY protocol) before this include. Guardian deliberately
# receives $remote_addr; without real-IP restoration every visitor collapses
# to the proxy address and shares its blocks/rate limits. Never trust forwarded
# client-IP headers from untrusted sources.
#
# APPLICATION CAPACITY BOUNDARY - protected application content is deliberately
# capacity-neutral. Do not add a universal request-rate or connection budget to
# content locations. `/__guardian/auth` runs once for every protected request,
# so it must never receive a fixed RPS value: that would silently become an
# application-wide limit. The companion angie-guardian-limits.conf supplies
# path-specific limits for Guardian's public control plane and the one shared
# in-flight ceiling on /__guardian/auth; that ceiling sheds overload without
# defining application throughput. Include it once in http {} before using this
# file.

# --- internal subrequest target -------------------------------------------
location = /__guardian/auth {
    internal;
    auth_request off;
    # The shared baseline is concurrency-only here. Unlike a generic RPS
    # value, it does not define application throughput; it bounds concurrent
    # Guardian evaluations. A limit_conn rejection is remapped below to the
    # auth_request-compatible 403+shed action, never into fail-open.
    limit_conn guardian_control_plane 512;
    limit_conn_status       429;
    error_page 429 =        @guardian_admission_shed;
    proxy_pass              http://guardian/auth;
    proxy_http_version      1.1;
    proxy_set_header        Connection        "";
    proxy_pass_request_body off;
    proxy_set_header        Content-Length    "";
    proxy_set_header        X-Guardian-Host   $host;
    proxy_set_header        X-Guardian-Method $request_method;
    proxy_set_header        X-Guardian-URI    $request_uri;
    proxy_set_header        X-Guardian-IP     $remote_addr;
    proxy_set_header        X-Guardian-UA     $http_user_agent;
    proxy_set_header        X-Guardian-Cookie $http_cookie;

    # Keep the auth hop snappy; see "fail mode" below for what happens on timeout.
    proxy_connect_timeout   2s;
    proxy_read_timeout      2s;

    # FAIL MODE — what happens when the Guardian sidecar is down:
    # Intercept only errors from this auth hop and turn a timeout, connection
    # failure, or Guardian 5xx into 204. auth_request treats that as allow and
    # resumes the site's ORIGINAL content handler. This makes fail-open work
    # for static files, try_files/FastCGI, proxy_pass, and other handlers
    # without duplicating any of them in a Guardian bypass location.
    #
    # Backend/FastCGI responses are not affected: this error_page exists only
    # inside the internal auth location. To fail CLOSED instead, comment out
    # the error_page line (leaving a Guardian failure to become a request 500).
    # You may then also comment/remove the now-unused @guardian_fail_open
    # location below. Do not remove only that location while this error_page
    # still references it: `angie -t` correctly rejects the dangling target.
    proxy_intercept_errors on;
    error_page 500 502 503 504 = @guardian_fail_open;
}

# `auth_request` understands only 2xx, 401 and 403. The 429 created by the
# internal auth location's concurrency limit must therefore become a marked
# 403: @guardian_denied converts action=shed to a client-visible 503, and the
# original content handler is never resumed. Keep this distinct from genuine
# Guardian 5xx above, which retain the deliberate fail-open contract.
location @guardian_admission_shed {
    auth_request off;
    add_header X-Guardian-Action shed always;
    return 403;
}

# FAIL-OPEN continuation target. After commenting the error_page line above to
# choose fail-closed, this whole location may also be commented out.
location @guardian_fail_open {
    auth_request off;
    return 204;
}

# --- ACME http-01 (optional) ------------------------------------------------
# Certificate renewal must keep working even for clients Guardian would block.
# guardian.example.yaml includes an optional fleet-wide allowlist entry for
# this fixed ACME prefix; use this location instead to bypass the auth
# subrequest at Angie. Example:
# location ^~ /.well-known/acme-challenge/ {
#     auth_request off;
#     root /var/www/acme;      # certbot --webroot -w /var/www/acme
# }

# --- Guardian-served pages ---------------------------------------------------
location @guardian_challenge { # PoW interstitial (self-contained HTML)
    auth_request off;
    # Guardian baseline admission. 429 is a deliberate control-plane shed;
    # this named location runs before proxying the costly challenge issue and
    # can never continue into the protected content handler.
    limit_req zone=guardian_challenge_ip burst=6 nodelay;
    limit_conn guardian_control_plane 512;
    limit_req_status                  429;
    limit_conn_status                 503;

    # Only intercept Guardian's own 401 responses. `error_page 401` applies to every
    # 401, including ones generated by ANGIE itself (most notably `auth_basic`).
    #
    # `auth_basic` runs before `auth_request`, so on those requests
    # `$guardian_action` is empty. Returning the original 401 preserves the
    # `WWW-Authenticate` header and lets the browser prompt for credentials instead
    # of serving the Guardian interstitial, which would otherwise create a challenge
    # loop.
    #
    # `challenge` and `refuse` are the only Guardian-generated 401 actions.
    #
    # Defining `add_header` here also prevents the location's interstitial CSP from
    # being inherited by the passed-through error page.
    if ($guardian_action !~ "^(challenge|refuse)$") {
        add_header Cache-Control "no-store" always;
        return 401;
    }

    # The interstitial needs its own CSP. Defining it here also prevents
    # inheritance of all server-level `add_header`s, including any site CSP that
    # would otherwise combine with this one and break the solver. Re-add any other
    # required headers (for example HSTS) in this location and `@guardian_denied`.
    #
    # `guardiand` sends the same CSP itself; this directive is kept solely for its
    # effect on header inheritance.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; worker-src 'self' blob:; connect-src 'self'; base-uri 'none'" always;

    # Named locations cannot use a URI in `proxy_pass`, so rewrite first, then
    # proxy. Always fetch the interstitial with an internal GET; the original
    # request body must never be forwarded to Guardian.
    rewrite ^ /challenge break;
    proxy_method                           GET;
    proxy_pass_request_body                off;
    proxy_set_header Content-Length        "";
    proxy_pass                             http://guardian;
    proxy_http_version                     1.1;
    # Override only the X-Guardian-* headers. Leave the client's own request
    # headers intact, especially `Sec-Fetch-*` and `Accept`, which Guardian uses
    # when deciding whether a request can realistically complete a challenge.
    #
    # Do not clear or rewrite those headers to change this behaviour. Use
    # `pow.refuse_unchallengeable` instead, so the auth and challenge hops continue
    # to agree on the recorded decision.
    proxy_set_header Connection            "";
    proxy_set_header X-Guardian-Host       $host;
    proxy_set_header X-Guardian-IP         $remote_addr;
    proxy_set_header X-Guardian-URI        $request_uri;
    proxy_set_header X-Guardian-UA         $http_user_agent;
    proxy_set_header X-Guardian-Difficulty $guardian_difficulty;
    # Forward the auth subrequest's challenge/refusal decision so this request
    # follows the already-recorded verdict instead of re-evaluating it. An empty
    # variable removes the header, restoring the previous behaviour. Setting the
    # header unconditionally also prevents clients from spoofing it.
    proxy_set_header X-Guardian-Refusal   $guardian_refusal;
}

location = /__guardian/pass {            # PoW solution submission (JS + no-JS)
    auth_request off;
    # Protect verification (especially Argon2id) before it reaches Guardian.
    limit_req zone=guardian_pass_ip burst=6 nodelay;
    limit_conn guardian_control_plane      512;
    limit_req_status                       429;
    limit_conn_status                      503;
    proxy_pass                             http://guardian/pass$is_args$args;
    proxy_http_version                     1.1;
    proxy_set_header Connection            "";
    proxy_set_header X-Guardian-Host       $host;
    proxy_set_header X-Guardian-IP         $remote_addr;
    proxy_set_header X-Guardian-UA         $http_user_agent;
    # $scheme tells Guardian whether the token cookie may carry the Secure
    # flag: over plain http a Secure cookie would never come back and the
    # client would loop on the challenge forever.
    proxy_set_header X-Guardian-Proto      $scheme;
}

# Content-addressed Argon2id worker/runtime/WASM. These files are installed
# separately so Angie can serve/cache them without proxying requests through
# guardiand. They are public by design and carry one-year immutable cache
# headers. The release installer places them in this directory; keep the
# filenames content-addressed and update the package when they change.
location ^~ /__guardian/assets/ {
    auth_request off;
    # Assets are cheap and cacheable, but still public control-plane traffic.
    limit_req zone=guardian_assets_ip burst=40 nodelay;
    limit_conn guardian_control_plane  512;
    limit_req_status                   429;
    limit_conn_status                  503;
    alias /usr/share/guardian/assets/;
    # Some minimal Angie installations do not load the global MIME map. The
    # browser refuses to execute a Worker served as text/plain, and the WASM
    # runtime likewise needs its correct media type.
    types {
        application/javascript js;
        application/wasm wasm;
    }
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location @guardian_denied {
    auth_request off;
    limit_conn guardian_control_plane 512;
    limit_conn_status 503;

    # Same reasoning as @guardian_challenge: a strict page-fitted CSP (the
    # denied page is inline-styled static HTML) that also stops the vhost's
    # server-level add_header set, site CSP included, from applying here, and
    # guardiand sends the same policy on the response itself.
    # (The shed `if` below defines its own add_header, so it never inherited
    # location or server headers to begin with.)
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'" always;
    # Load-shedding under attack: when attack_mode.effects.max_inflight is
    # reached, the sidecar answers the auth subrequest with 403 and
    # X-Guardian-Action: shed (auth_request only forwards 2xx/401/403, so a
    # bare 503 would become a 500 and trigger fail-open continuation of the
    # site's handler). Turn that into a real 503 + Retry-After for the client
    # instead of the denied page.
    if ($guardian_action = shed) {
        add_header Retry-After 2 always;
        return 503;
    }

    # VOLUMETRIC ATTACK OPTIMIZATION:
    # By default, Angie proxies to /denied to render Guardian's styled 403 HTML page.
    # If your site faces massive volumetric 403 floods (e.g. distributed scrapers or
    # scanner botnets), uncomment `return 403;` below. This serves a bare 403
    # directly from Angie memory without making a second proxy hop to the sidecar.
    #
    # return 403;

    rewrite ^ /denied break;
    proxy_pass                  http://guardian;
    proxy_http_version          1.1;
    proxy_set_header Connection "";
}

# Optional Angie server-hardening profile for a public server {} block.
# Requires angie-hardening-http.conf to be included once in http {}.
#
# These are conservative starting values for ordinary API/web traffic. Review
# client body size, timeout, concurrency, and keepalive requirements before
# enabling them on upload, streaming, long-polling, or WebSocket endpoints.

ssl_protocols TLSv1.2 TLSv1.3;
ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
ssl_prefer_server_ciphers off;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

# Timeout directives are inactivity timers, not total request-duration caps.
# client_header_timeout also bounds clients that never complete TLS setup.
client_header_timeout 10s;
client_body_timeout 15s;
send_timeout 15s;

keepalive_timeout 15s;
keepalive_requests 1000;
keepalive_time 1h;

client_header_buffer_size 1k;
large_client_header_buffers 4 8k;
client_max_body_size 1m;

# HTTP/2 request bodies are initially buffered only to this bounded amount.
http2_max_concurrent_streams 64;
http2_body_preread_size 16k;

# Bound complete, active requests at two complementary scopes: per source
# address and across the entire virtual host. In HTTP/2 and HTTP/3, each request
# counts separately. Connections that have not supplied complete headers require
# upstream/kernel admission controls as described in the hardening guide.
limit_conn angie_hardening_client 20;
limit_conn angie_hardening_server 1024;
limit_conn_status 429;

reset_timedout_connection on;

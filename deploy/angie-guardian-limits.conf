# Angie Guardian control-plane admission (http {} scope).
#
# Include this file ONCE in Angie http {}, before any server {} that includes
# angie-guardian.conf:
#
#   include /etc/angie/angie-guardian-limits.conf;
#
# These deliberately cover only Guardian-owned work. They do not limit
# application content. /__guardian/auth is an internal subrequest for every
# protected application request, so it receives only the shared concurrency
# ceiling, never a fixed RPS value that would silently become an application
# rate limit.
#
# The per-host keys avoid one virtual host's visitors spending another host's
# control-plane budget. $host is safe as a limiter namespace here; Guardian
# still selects and validates policy itself. The limits are conservative
# defaults, not capacity planning. Override the zones and/or directives for a
# deployment after measuring its normal and attack traffic.

limit_req_zone "$host$binary_remote_addr" zone=guardian_challenge_ip:10m rate=30r/m;
limit_req_zone "$host$binary_remote_addr" zone=guardian_pass_ip:10m rate=30r/m;
limit_req_zone "$host$binary_remote_addr" zone=guardian_assets_ip:10m rate=20r/s;

# One sidecar-wide concurrent-work ceiling, shared by all vhosts that use this
# file in this Angie instance. The actual limit of 128 concurrent connections
# is enforced in angie-guardian.conf at Guardian's own infrastructure locations
# (__guardian/auth, @guardian_challenge, /__guardian/pass, /__guardian/assets/).
# This is deliberately concurrency, not a global requests-per-second budget:
# it bounds active Guardian control-plane work without assuming the protected
# application's throughput.
map $host $guardian_control_plane_key {
    default guardian;
}
limit_conn_zone $guardian_control_plane_key zone=guardian_control_plane:1m;
# Actual limit of 512 concurrent connections is enforced in angie-guardian.conf
# at Guardian's own infrastructure locations (__guardian/auth, @guardian_challenge,
# /__guardian/pass, /__guardian/assets/).
